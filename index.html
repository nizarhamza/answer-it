/* OpenTDB session token. OpenTDB will happily hand back the same popular questions over and
   over; a session token is its own answer to that - it never returns a question twice for the
   same token until the category is exhausted, and then says so (response_code 4) instead of
   repeating. That makes it the one repetition fix we do not have to invent. Tokens go stale
   after 6 hours idle (response_code 3), so the stored one carries a timestamp.
   Everything below goes through opentdbWait(): OpenTDB rate-limits to one request per 5s per
   IP, and a token request is a request like any other. */
const OPENTDB_TOKEN_KEY = "answerit_opentdb_token";
const OPENTDB_TOKEN_TTL_MS = 5.5 * 60 * 60 * 1000; // under OpenTDB's own 6h idle expiry
let opentdbThrottle = null;
function opentdbWait(){
  // Built lazily rather than at load so the interval is only ever paid by a session that
  // actually reaches OpenTDB - and so a test can swap createThrottle out first.
  if (!opentdbThrottle) opentdbThrottle = createThrottle(5500);
  return opentdbThrottle();
}
function readStoredToken(){
  try {
    const saved = JSON.parse(localStorage.getItem(OPENTDB_TOKEN_KEY) || "null");
    if (saved && saved.token && Date.now() - saved.at < OPENTDB_TOKEN_TTL_MS) return saved.token;
  } catch {}
  return null;
}
function storeToken(token){
  try {
    if (token) localStorage.setItem(OPENTDB_TOKEN_KEY, JSON.stringify({ token, at: Date.now() }));
    else localStorage.removeItem(OPENTDB_TOKEN_KEY);
  } catch {}
}
async function requestOpenTDBToken(){
  await opentdbWait();
  const data = await fetchJson("https://opentdb.com/api_token.php?command=request");
  const token = data && data.response_code === 0 ? data.token : null;
  storeToken(token);
  return token;
}
async function resetOpenTDBToken(token){
  await opentdbWait();
  await fetchJson(`https://opentdb.com/api_token.php?command=reset&token=${encodeURIComponent(token)}`);
  // A reset keeps the same token and simply forgets what it has served, so the stored timestamp
  // is refreshed rather than the token thrown away.
  storeToken(token);
}
async function fetchOpenTDB({categoryId, difficulty, amount=50}={}){
  let token = readStoredToken() || await requestOpenTDBToken();
  for (let attempt = 0; attempt < 2; attempt++){
    const p = new URLSearchParams({ amount:String(Math.min(50,amount)), category:String(categoryId), difficulty, type:"multiple", encode:"url3986" });
    if (token) p.set("token", token);
    await opentdbWait();
    const data = await fetchJson(`https://opentdb.com/api.php?${p}`);
    if (!data) return [];
    if (data.response_code === 0) return data.results || [];
    // 4 = this token has now seen every question in that bucket; 3 = the token expired. Both are
    // recoverable exactly once, and both fall through to an untokened request if recovery fails
    // rather than leaving the round short.
    if (data.response_code === 4 && token){ await resetOpenTDBToken(token); continue; }
    if (data.response_code === 3){ storeToken(null); token = await requestOpenTDBToken(); continue; }
    return [];
  }
  return [];
}
function createThrottle(minIntervalMs){
  let last=0;
  return async function wait(){
    const now=Date.now(); const delay=Math.max(0, last+minIntervalMs-now);
    last = now+delay;
    if (delay) await new Promise(r=>setTimeout(r,delay));
  };
}

/* ============================================================
   Round building (solo - direct browser fetch, §6.2)
   ============================================================ */
// ---------------------------------------------------------------------------------------
// QUALITY GATE - mirrors worker/src/quality.js (kept in sync by hand, same rule as the game
// core mirror above). Everything an API hands us goes through gradeQuestion() before it can
// enter the pool; the curated bank in bank/curated-core.js is written to pass it and enters
// pre-scored. See ANSWER-IT.md §6.5 and QUESTIONS.md.
// ---------------------------------------------------------------------------------------

const MIN_BANK_SCORE = 66; // tuned against a live sample - see QUESTIONS.md

// Curated questions sort above every API question in a bucket - that is the whole hybrid.
const CURATED_SCORE = 95;

/* ============================================================
   §6.5.1 - Hard rejects
   ============================================================ */

const MIN_QUESTION_LEN = 20;   // MAX_QUESTION_LEN (180) is already declared by the sources mirror above
const MAX_ANSWER_LEN = 45;   // longer than this and nobody can type it, or read it under 15s
const MIN_ANSWER_LEN_OPEN = 2;   // "K" is a fine multiple-choice answer and a terrible typed one

// Meta-phrasings that only make sense on a paper quiz, plus questions that lean on media we
// don't have (§22 image/audio questions are parked).
const BAD_PHRASING = [
  /which of the following/i,
  /\ball of the above\b/i,
  /\bnone of the above\b/i,
  /\b(pictured|shown|depicted) (above|below|here)\b/i,
  /\bin the (image|picture|photo|video|clip)\b/i,
  /\bthis (song|image|picture|clip|logo)\b/i,
  /\bfill in the blank\b/i,
  /\b(true or false)\b/i,
  /_{3,}/,                              // fill-in-the-gap templates
];

// "Correct as of when?" questions rot. Anything scoped to a past year is out.
const STALE = /\bas of\s+(19|20)\d\d\b|\bin\s+20(0\d|1\d|2[0-5])\b(?=[^?]*\bcurrently\b)/i;

// Domestic-only material: the single biggest driver of "these questions aren't for us".
// Deliberately narrow - it kills leagues/soaps/civics that only land in one country, and leaves
// globally-followed things (Premier League, NBA, Olympics, Hollywood) alone.
const PAROCHIAL = [
  /\bNFL\b|\bNASCAR\b|\bSuper Bowl\b|\bMajor League Baseball\b|\bMLB\b|\bNHL\b/i,
  /\bAmerican football\b|\bWorld Series\b|\bStanley Cup\b/i,
  /\b(which|what)\s+(U\.?S\.?|American|British|English|Australian|Canadian)\s+(state|county|city|town|province|shire)\b/i,
  /\bstate capital\b|\bcounty in (England|Ireland|Wales|Scotland)\b/i,
  /\bEastEnders\b|\bCoronation Street\b|\bHollyoaks\b|\bNeighbours\b|\bHome and Away\b/i,
  /\bSaturday Night Live\b|\bJeopardy!?\b|\bWheel of Fortune\b/i,
  /\bcongressman\b|\bsenator from\b|\bMember of Parliament for\b/i,
  /\bA-?Level\b|\bGCSE\b|\bSAT\b(?!\w)/i,
];

// ---- Tag policy (The Trivia API only; OpenTDB ships no tags) --------------------------------
// Tags turn out to be the single most useful quality signal the API gives us - far better than
// `difficulty`. Three buckets:

// 1. Straight out. Domestic-league sport, gambling, and one-hit-wonder nostalgia are the exact
//    material that made the first playtest fall flat.
const TAG_REJECT = new Set([
  "us_states", "american_football", "nfl", "baseball", "mlb", "nascar", "horse_racing",
  "gambling", "casinos", "one_hit_wonders", "soap_operas", "british_sitcoms", "nhl",
  "college_football", "college_basketball", "rodeo", "poker",
]);

// 2. Fandom deep-cuts. Fine as *Hell* material, never as the easy/medium body of a round.
const DEEP_CUT_TAGS = new Set([
  "warhammer", "magic_the_gathering", "yu_gi_oh", "runescape", "world_of_warcraft",
  "elder_scrolls", "star_trek", "doctor_who", "my_little_pony", "gundam", "cult_films",
]);

// 3. Soft penalties. A question tagged for one country, or for a decade most of the room did not
//    live through, is not *wrong* - it just loses to a question that travels.
const COUNTRY_TAGS = new Set([
  "usa", "uk", "england", "scotland", "wales", "ireland", "northern_ireland",
  "australia", "new_zealand", "canada", "ohio", "texas", "california", "florida",
]);
const DECADE_TAGS = /^(19[0-8]0)('?s)?$/;
const DRY_TAGS = new Set(["words", "language", "etymology", "vocabulary", "measurements"]);

// "Which Heavweight Boxer Was Known As The Real Deal?" - capitalising every word correlates
// almost perfectly with sloppy, mis-spelled, user-submitted entries.
function isTitleCased(text) {
  const words = text.split(/\s+/).filter((w) => /^[A-Za-z]{4,}$/.test(w));
  if (words.length < 4) return false;
  const caps = words.filter((w) => /^[A-Z]/.test(w)).length;
  return caps / words.length > 0.7;
}

const YEAR_RE = /^(1[0-9]{3}|20[0-9]{2})$/;
const NUMERIC_RE = /^-?[\d.,]+$/;

function isYearSet(options) {
  return options.length > 1 && options.every((o) => YEAR_RE.test(o.trim()));
}

function numericSpread(options) {
  const nums = options.map((o) => Number(String(o).replace(/,/g, ""))).filter((n) => Number.isFinite(n));
  if (nums.length !== options.length) return null;
  return Math.max(...nums) - Math.min(...nums);
}

// Two options that are the same answer twice make the question unanswerable. Note the bar is
// *sameness*, not similarity: "O negative" vs "B negative" and "Bollywood" vs "Tollywood" are one
// edit apart and both perfectly fair, so an edit-distance rule here would eat good questions.
// The only similarity we do catch is one option swallowing another whole ("Titanic" / "Titanic ").
function hasNearDuplicateOptions(options) {
  const norm = options.map((o) => normalizeAnswer(o));
  for (let i = 0; i < norm.length; i++) {
    for (let j = i + 1; j < norm.length; j++) {
      const a = norm[i], b = norm[j];
      if (!a || !b) return true;
      if (a === b) return true;
      const [shortS, longS] = a.length <= b.length ? [a, b] : [b, a];
      if (shortS.length >= 6 && longS.includes(shortS) && shortS.length / longS.length > 0.9) return true;
    }
  }
  return false;
}

// The answer sitting inside the question text is a free point. Matched on whole words, because
// substring matching thinks "Which vitamin does your skin make..." gives away "Vitamin D".
function answerLeaksIntoText(text, answer) {
  const a = normalizeAnswer(answer);
  if (a.length < 4) return false;
  const words = normalizeAnswer(text).split(" ");
  const target = a.split(" ");
  for (let i = 0; i + target.length <= words.length; i++) {
    let hit = true;
    for (let k = 0; k < target.length; k++) if (words[i + k] !== target[k]) { hit = false; break; }
    if (hit) return true;
  }
  return false;
}

/* ============================================================
   §6.5.2 - grade()
   ============================================================
   Returns { ok, reason, score }. `score` (0-100) only means anything when ok is true; the bank
   sorts by it so the best of a batch lands in the bank and the rest is dropped, rather than
   taking whatever the API happened to return first.
*/
function gradeQuestion(q, { allowNiche = false, strictRegion = true } = {}) {
  const text = String(q.text || "").trim();
  const answer = String(q.correctAnswer ?? q.options?.[q.answerIndex] ?? "").trim();
  const options = (q.options || []).map((o) => String(o).trim());
  const reject = (reason) => ({ ok: false, reason, score: 0 });

  if (text.length < MIN_QUESTION_LEN) return reject("too-short");
  if (text.length > MAX_QUESTION_LEN) return reject("too-long");
  if (!answer) return reject("no-answer");
  if (q.type === "open" && answer.length < MIN_ANSWER_LEN_OPEN) return reject("answer-too-short-to-type");
  if (answer.length > MAX_ANSWER_LEN) return reject("answer-unwieldy");
  if (q.type === "choice" && options.length !== 4) return reject("bad-option-count");

  for (const re of BAD_PHRASING) if (re.test(text)) return reject("meta-phrasing");
  if (STALE.test(text)) return reject("stale-scoped");
  if (strictRegion) for (const re of PAROCHIAL) if (re.test(text)) return reject("parochial");
  if (answerLeaksIntoText(text, answer)) return reject("answer-leak");

  // Pure guess-the-year / guess-the-number questions. A four-year spread of 3 is a coin flip
  // whatever the event, so that is a reject; wider spreads are merely *dull* ("in which year did
  // WWII end?" is a fair question), so they take a score penalty and sink below better material.
  let dullNumbers = 0;
  if (options.length) {
    if (hasNearDuplicateOptions(options)) return reject("ambiguous-options");
    const spread = numericSpread(options);
    if (isYearSet(options)) {
      if (spread !== null && spread <= 3) return reject("coin-flip-year");
      if (spread !== null && spread <= 40) dullNumbers = 20;
    } else if (options.every((o) => NUMERIC_RE.test(o))) {
      const biggest = Math.max(...options.map((o) => Math.abs(Number(String(o).replace(/,/g, "")))));
      if (spread !== null && biggest >= 100 && spread / biggest < 0.08) return reject("coin-flip-number");
      if (spread !== null && biggest > 0 && spread / biggest < 0.25) dullNumbers = 10;
    }
  }

  const tags = (q.tags || []).map((t) => String(t).toLowerCase().replace(/[^a-z0-9_']/g, ""));
  if (tags.some((t) => TAG_REJECT.has(t))) return reject("blocked-tag");
  if (!allowNiche && tags.some((t) => DEEP_CUT_TAGS.has(t))) return reject("deep-cut-tag");
  if (!allowNiche && q.isNiche && q.level !== "hard") return reject("niche-outside-hell");

  /* --- scoring: everything below here has already passed --- */
  let score = 60;
  //  Short, clean questions play better out loud on a shared screen.
  if (text.length <= 90) score += 10;
  else if (text.length > 140) score -= 10;
  //  A short answer is a *sayable* answer - and it is what makes a blind Hell round possible.
  if (answer.length <= 20) score += 8;
  //  Parentheticals are almost always a disambiguation the writer needed and the player doesn't.
  if (/\(/.test(text)) score -= 8;
  //  Dates and roman numerals as answers are the driest thing the APIs ship.
  if (YEAR_RE.test(answer) || /^[IVXLC]+$/.test(answer)) score -= 12;
  //  Negations flip half the room's answer for the wrong reason.
  if (/\bnot\b|\bexcept\b|\bnever\b/i.test(text)) score -= 10;
  //  Niche is a Hell ingredient, so it is worth *more* when we are explicitly shopping for Hell.
  if (q.isNiche) score += allowNiche ? 12 : -15;
  //  Trivia API region hints: a question tagged for one country travels badly.
  if (Array.isArray(q.regions) && q.regions.length && q.regions.length <= 2) score -= 10;
  score -= dullNumbers;
  //  Tag signals (see the tag policy above).
  if (tags.some((t) => COUNTRY_TAGS.has(t))) score -= 14;
  if (tags.some((t) => DECADE_TAGS.test(t))) score -= 14;
  if (tags.some((t) => DRY_TAGS.has(t))) score -= 10;
  //  A period reference in the text itself does the same job as a decade tag.
  if (/\b(19[0-8]\d)\b/.test(text) || /\b([2-8]0'?s)\b/.test(text)) score -= 10;
  //  A quoted two-word proper name is almost always a character nobody outside the fandom knows
  //  ("Which film contains the character 'Carl Spackler'?").
  if (/['\u2018\u201c"][A-Z][a-z]+ [A-Z][a-z]+['\u2019\u201d"]/.test(text)) score -= 12;
  //  Title-Cased Questions Like This One are user submissions, and they are reliably the worst
  //  written and most typo-ridden entries in the pool.
  if (isTitleCased(text)) score -= 18;
  //  "Which of these ..." is paper-quiz phrasing; survivable, but never the best question in a batch.
  if (/which of these/i.test(text)) score -= 4;
  //  "Which book contains the character 'X'?" is a template the APIs run on very obscure works.
  if (/contains the (character|line|quote)/i.test(text)) score -= 14;
  //  A long quoted title is usually a work only specialists have heard of.
  const quoted = text.match(/['\u2018\u201c"]([^'\u2019\u201d"]{6,})['\u2019\u201d"]/);
  if (quoted && quoted[1].length > 28) score -= 8;

  return { ok: true, reason: null, score: Math.max(0, Math.min(100, score)) };
}

// A Hell `blind` promotion (§5.2) strips the options, so the answer has to survive being typed:
// long enough to be unambiguous, short enough to bother.
function isBlindEligible(q) {
  const a = String(q.correctAnswer ?? q.options?.[q.answerIndex] ?? "").trim();
  return a.length >= MIN_ANSWER_LEN_OPEN && a.length <= 30 && !/^[\d.,]+$/.test(a);
}

/* ============================================================
   §6.5.5 - The curated core
   ============================================================
   bank/curated-core.js is a classic script that assigns globalThis.ANSWER_IT_CURATED, so the
   same file works via <script src> over file:// and via a side-effect import in the Worker.
*/
function slug(s) {
  return normalizeAnswer(s).replace(/\s+/g, "-").slice(0, 48);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Curated row (compact keys, see bank/curated-core.js) -> the §3 Question shape.
function normalizeCurated(row, buildAccepted, { asOpen = false } = {}) {
  const correct = String(row.a).trim();
  const options = shuffle([correct, ...row.w.map((s) => String(s).trim())]);
  const open = asOpen && row.o === true;
  const text = String(row.t).trim();
  return {
    id: `cur:${row.c}:${slug(row.t)}`,
    key: contentKey(text),
    source: "custom",
    text,
    category: row.c,
    level: row.l,
    type: open ? "open" : "choice",
    options: open ? [] : options,
    answerIndex: open ? -1 : options.indexOf(correct),
    accepted: buildAccepted(correct),
    modifiers: [],
    timeLimit: null,
    media: null,
    isNiche: !!row.n,
    region: row.r || "global",
    correctAnswer: correct,
  };
}

function loadCurated(buildAccepted, { category, level, region, asOpen = false } = {}) {
  const rows = globalThis.ANSWER_IT_CURATED || [];
  return rows
    .filter((r) => (!category || r.c === category) && (!level || r.l === level) && (!region || r.r === region))
    .map((r) => normalizeCurated(r, buildAccepted, { asOpen }));
}


const MAX_OPENTDB_TOPUPS = 10;

// How many questions a single (category,level) bucket needs before it's "not thin" - scales
// with how few categories are selected (a lone category has to cover a whole level's share of
// the round by itself; with Mix's 10 categories the LRU rotation spreads that share thin, so
// each bucket needs far less depth). Without this, "Mix" over-triggers the slow throttled
// OpenTDB top-up path on every category even though most only need 2-3 questions each.
function minPerBucket(n, categoryCount){
  const worstCaseLevelShare = Math.ceil(n * 0.6); // generous upper bound across all profiles/adaptive extremes
  return Math.max(3, Math.ceil(worstCaseLevelShare / categoryCount) + 2);
}

async function buildPool(categories, n, onProgress, shouldCancel, region){
  const regionFilter = region && region!=="any" ? region : null;
  const minBucket = minPerBucket(n, categories.length);
  const pool = {};
  for (const c of categories) pool[c] = { easy:[], medium:[], hard:[] };
  const seen = new Set();
  // Curated core first (§6.5.6). These are the questions the round actually wants; everything
  // fetched below only tops up what the bank cannot cover. It also means a round is playable
  // before a single network call returns, and stays playable when both APIs are down.
  for (const c of categories){
    for (const q of loadCurated(buildAccepted, { category:c, region:regionFilter })){
      if (!pool[c][q.level]) continue;
      if (seen.has(q.key)) continue;
      seen.add(q.key);
      pool[c][q.level].push({ ...q, _score: CURATED_SCORE });
    }
  }
  function ingest(list, source, forcedCategory){
    for (const raw of list){
      let cat = forcedCategory;
      if (!cat && source==="trivia-api") cat = TRIVIA_TO_ANSWERIT[raw.category] || null;
      if (!cat || !categories.includes(cat)) continue;
      const q = normalizeQuestion(raw, source, cat);
      if (!q || !["easy","medium","hard"].includes(q.level)) continue;
      // Keyed on content, so a question the curated bank already covers (or that the other API
      // also returned) is skipped rather than entering the pool a second time under a new id.
      if (seen.has(q.key)) continue;
      // §6.5 - the APIs are a volume source, not a quality source. A gate failure never enters
      // the pool; what survives carries its score so the bucket can sort best-first. Note the
      // MIN_BANK_SCORE threshold is deliberately NOT applied here: solo has no bank to fall back
      // on, so a weak-but-valid question is kept and simply sorted to the bottom where it is only
      // ever reached if the bucket runs dry.
      const grade = gradeQuestion({ ...q, tags: raw.tags, regions: raw.regions });
      if (!grade.ok) continue;
      seen.add(q.key);
      pool[cat][q.level].push({ ...q, _score: grade.score });
    }
  }
  // Before spending a single request: whatever the last round fetched and never used. Deduped on
  // content like everything else, so a carried-over question the curated bank already covers is
  // dropped rather than shadowing it.
  for (const q of loadCarryover()){
    if (!q || !categories.includes(q.category)) continue;
    if (regionFilter && q.region !== regionFilter) continue; // API-sourced carryover has no region tag, so this drops it whenever a region is picked
    if (!pool[q.category] || !pool[q.category][q.level]) continue;
    if (seen.has(q.key)) continue;
    seen.add(q.key);
    pool[q.category][q.level].push(q);
  }

  // A region filter means a curated-only pool - neither API tags its questions by region, so
  // there is nothing here to filter by; skip the fetch entirely rather than pulling in
  // region-unlabelled questions no filter could ever apply to.
  if (!regionFilter){
    onProgress?.({ key:"fetchingQuestions" });
    const triviaCats = [...new Set(categories.flatMap(c => TRIVIA_API_CATEGORIES[c]||[]))];
    const calls = [];
    // Two calls PER difficulty (rather than more calls of the same easy/medium/hard mix) -
    // Trivia API's random sample is skewed hard toward medium/hard (measured live: a 50-question
    // mixed batch came back ~3 easy / 27 medium / 20 hard), so asking for a mixed batch repeatedly
    // mostly buys more medium/hard duplicates. Requesting each difficulty explicitly is what
    // actually clears every category's easy bucket without falling through to the throttled
    // OpenTDB top-up - measured live: 10/27 thin buckets down to 3/27 for a 9-category Mix.
    if (triviaCats.length) for (const d of ["easy","medium","hard"]) for (let i=0;i<2;i++) calls.push(fetchTriviaApi({categories:triviaCats, limit:50, difficulties:[d]}).then(r=>ingest(r,"trivia-api")));
    if (categories.includes("games")) calls.push(fetchTriviaApi({tags:TRIVIA_API_TAGS.games, limit:50}).then(r=>ingest(r,"trivia-api","games")));
    await Promise.all(calls);

    const need = [];
    for (const c of categories) for (const L of ["easy","medium","hard"]) if (pool[c][L].length < minBucket) need.push([c,L]);
    if (need.length){
      const capped = need.slice(0, MAX_OPENTDB_TOPUPS);
      for (let i=0; i<capped.length; i++){
        if (shouldCancel?.()) throw new RoundCancelled();
        const [c,L] = capped[i];
        onProgress?.({ key:"toppingUp", i:i+1, total:capped.length });
        const ids = OPENTDB_CATEGORIES[c]||[];
        if (!ids.length) continue;
        const id = ids[Math.floor(Math.random()*ids.length)];
        const r = await fetchOpenTDB({categoryId:id, difficulty:L, amount:50}); // throttles itself
        ingest(r, "opentdb", c);
      }
    }
  }
  // Freshness is a sort key, not a filter. The previous version dropped seen questions from a
  // bucket only while `fresh.length >= min(arr.length, minBucket)` still held, which quietly did
  // nothing on exactly the thin single-category buckets that needed it most. Sorting instead can
  // never starve a round: a repeat is only reached once every fresh question in the bucket has
  // been used up, and when it is, the one you saw longest ago goes first. Quality (§6.5) stays
  // the tie-break, so best-first still holds among questions of equal freshness.
  const seenAt = loadSeen();
  for (const c of categories) for (const L of ["easy","medium","hard"]){
    pool[c][L].sort((a,b) => {
      const sa = seenAt.get(a.key) || 0, sb = seenAt.get(b.key) || 0;
      if (!sa !== !sb) return sa ? 1 : -1;    // never served before wins outright
      if (sa !== sb) return sa - sb;          // then longest-ago-seen
      return (b._score||0) - (a._score||0);   // then best-first
    });
    // Stamped so the samplers can see where the fresh half of a bucket ends without re-reading
    // localStorage on every draw.
    for (const q of pool[c][L]) q._seenAt = seenAt.get(q.key) || 0;
  }
  return pool;
}
class RoundCancelled extends Error {}

function poolTotal(pool, categories, level){
  return categories.reduce((s,c)=>s+(pool[c]?.[level]?.length||0), 0);
}
// Widens outward from `preferred` (same distance easier/harder alternating, easier first) to
// find the nearest level with any question left across the selected categories - §20 "fill
// from the next-nearest level, never silently shorten the round."
function nearestAvailableLevel(pool, categories, preferred){
  const idx = LEVELS.indexOf(preferred);
  for (let d=0; d<LEVELS.length; d++){
    for (const cand of [idx-d, idx+d]){
      if (cand<0 || cand>=LEVELS.length-1) continue; // -1: "hell" isn't a pool bucket (drawn from hard)
      const L = LEVELS[cand];
      if (poolTotal(pool, categories, L) > 0) return L;
    }
  }
  return null;
}

// §6.5.6 - the hybrid draw. Curated questions win most draws but not all of them: leaning 100%
// on the curated core would make every round the same 505 questions, which is the *other* half
// of the "these questions are repetitive" complaint. So we roll for a side first, then sample.
// Within the API side the bucket is sorted best-first, so we only sample its stronger half.
const CURATED_SHARE = 0.6; // mirrors DEFAULT_CURATED_SHARE in worker/src/quality.js
function pickQualityIndex(arr){
  if (arr.length <= 1) return 0;
  const curated = [], rest = [];
  for (let i=0; i<arr.length; i++) (arr[i].source === "custom" ? curated : rest).push(i);
  const freshIn = list => list.filter(i => !arr[i]._seenAt).length;
  const cFresh = freshIn(curated), rFresh = freshIn(rest);
  let useCurated = curated.length > 0 && (rest.length === 0 || Math.random() < CURATED_SHARE);
  // The 60/40 split decides which side is *better*, not which side is available. When one side
  // has no questions left that you haven't already seen and the other does, take the fresh side:
  // a fresh API question beats a curated repeat, and vice versa. Without this the curated side
  // kept winning its 60% of the draws long after its small buckets had been used up.
  if (useCurated && cFresh === 0 && rFresh > 0) useCurated = false;
  else if (!useCurated && rFresh === 0 && cFresh > 0) useCurated = true;
  const from = useCurated ? curated : rest;
  // `from` keeps the bucket's order, which buildPool sorts fresh-first. Sampling a window from
  // the front is what carries that ordering into the draw - taking the curated side uniformly,
  // as this used to, threw the freshness sort away for 60% of every round. The floor keeps the
  // window wide enough that a small bucket still varies between rounds instead of going
  // deterministic.
  let span = Math.max(1, Math.min(from.length, Math.max(4, Math.ceil(from.length * 0.5))));
  // Never let the window reach past the fresh questions into ones already played, so long as
  // two fresh ones remain to choose between. Without this clamp the floor above happily spilled
  // into the seen tail of a small curated bucket, which is precisely the overlap the freshness
  // sort exists to remove. (`from` holds bucket indices in order, and the bucket is sorted
  // fresh-first, so the fresh entries are its first `fresh` positions.)
  const fresh = from.filter(i => !arr[i]._seenAt).length;
  if (fresh >= 2) span = Math.min(span, fresh);
  return from[Math.floor(Math.random()*span)];
}

function makeRoundSession(pool, settings){
  const n = settings.n;
  const categories = settings.categories;
  const fixedBudget = settings.intensity==="adaptive" ? null : allocateCounts(n, PROFILES[settings.intensity]);
  const used = { easy:0, medium:0, hard:0, hell:0 };
  const served = []; // {level, category}
  const servedKeys = [];
  const rolling = [];
  const lastCats = [];
  const notices = [];
  const styleAllowsBlind = settings.style !== "open"; // blind's whole point is injecting an open Q into a choice/mixed round

  // Anchored to the WHOLE round (n), not what's left, then `used` is subtracted - that's what
  // lets a level's share actually run out and hand the turn to the next-largest one. This used
  // to allocate over remaining() for adaptive, with no memory of `used` at all: recomputed from
  // scratch every question, "easy" (always the largest single share of any profile) kept winning
  // pickLevel()'s eligible.reduce comparison forever except for the one-question detour the
  // no-3-in-a-row rule forced to "medium" - hard and hell never got a turn. Recomputing the
  // *profile* every question (rollingAccuracy can move it) while anchoring the *target* to n is
  // what actually makes "adaptive" mean "the mix shifts", not "some levels never get served".
  function levelBudget(){
    const profile = fixedBudget ? null : adaptiveProfile(rollingAccuracy(rolling));
    const target = fixedBudget || allocateCounts(n, profile);
    return LEVELS.reduce((acc,L)=>{ acc[L]=Math.max(0, target[L]-used[L]); return acc; }, {});
  }

  function pickLevel(pos){
    if (pos===0) return "easy";
    const target = levelBudget();
    const placedLevels = served.map(s=>s.level);
    let eligible = LEVELS.filter(L => target[L]>0 && levelEligibleAt(L,pos,n,placedLevels) && (L==="hell" ? poolTotal(pool,categories,"hard")>0 : poolTotal(pool,categories,L)>0));
    if (!eligible.length) eligible = LEVELS.filter(L => target[L]>0 && (L==="hell" ? poolTotal(pool,categories,"hard")>0 : poolTotal(pool,categories,L)>0));
    if (!eligible.length) eligible = LEVELS.filter(L => (L==="hell" ? poolTotal(pool,categories,"hard")>0 : poolTotal(pool,categories,L)>0));
    if (!eligible.length) return null; // pool fully exhausted
    return eligible.reduce((a,b)=> (target[a]||0) >= (target[b]||0) ? a : b);
  }

  function pickCategory(sourceLevel){
    const last2 = lastCats.slice(-2);
    const withStock = categories.filter(c => pool[c][sourceLevel].length>0);
    if (!withStock.length) return null;
    const fresh = withStock.filter(c => !(last2.length===2 && last2[0]===c && last2[1]===c));
    const pickFrom = fresh.length ? fresh : withStock;
    // least-recently-used: prefer a category not seen in the last few picks - ascending by
    // lastIndexOf puts the stalest category (or one never used yet, -1) first.
    pickFrom.sort((a,b) => lastCats.lastIndexOf(a) - lastCats.lastIndexOf(b));
    return pickFrom[0];
  }

  function draw(level){
    const sourceLevel = level==="hell" ? "hard" : level;
    const category = pickCategory(sourceLevel);
    if (!category) return null;
    const arr = pool[category][sourceLevel];
    let question, modifier=null;
    if (level==="hell"){
      const picked = pickHellQuestion(arr, { allowBlind: styleAllowsBlind });
      if (!picked) return null;
      question = picked.question; modifier = picked.modifier;
      arr.splice(arr.indexOf(question), 1);
      question = applyHellModifier(question, modifier);
    } else {
      const i = pickQualityIndex(arr);
      question = arr[i];
      arr.splice(i,1);
    }
    lastCats.push(category);
    return { question, category };
  }

  function applyStyle(q){
    if (q.type==="open") return q; // already open (blind promotion)
    if (settings.style==="open") return { ...q, type:"open", options:null };
    if (settings.style==="mixed" && Math.random() < 0.30) return { ...q, type:"open", options:null };
    return q;
  }

  function finalize(q, isDouble){
    q = applyStyle(q);
    q.timeLimit = finalizeTimeLimit(q, settings.extended);
    q.isDouble = !!isDouble;
    if (q.type==="open") q.options = null;
    return q;
  }

  function nextQuestion(){
    if (served.length >= n) return null;
    const pos = served.length;
    let level = pickLevel(pos);
    if (!level){
      const nearest = nearestAvailableLevel(pool, categories, "medium");
      if (!nearest) return null;
      level = nearest;
      notices.push({ key:"ranShort" });
    }
    let drawn = draw(level);
    if (!drawn){
      const nearest = nearestAvailableLevel(pool, categories, level);
      if (!nearest) return null;
      notices.push({ key:"toppedUpFrom", level, nearest });
      level = nearest;
      drawn = draw(level);
      if (!drawn) return null;
    }
    used[drawn.question.level] = (used[drawn.question.level]||0) + 1;
    served.push({ level: drawn.question.level, category: drawn.category });
    servedKeys.push(drawn.question.key);
    return finalize({ ...drawn.question, category: drawn.category });
  }

  function buildDouble(){
    const lvl = doubleLevel(served.map(s=>s.level));
    let drawn = draw(lvl);
    if (!drawn){
      const nearest = nearestAvailableLevel(pool, categories, lvl);
      if (nearest) drawn = draw(nearest);
    }
    if (!drawn) return null;
    servedKeys.push(drawn.question.key);
    return finalize({ ...drawn.question, category: drawn.category }, true);
  }

  function recordOutcome(correct){
    rolling.push(correct);
    if (rolling.length>5) rolling.shift();
  }

  return { nextQuestion, buildDouble, recordOutcome, notices, get rolling(){ return rolling; }, get servedKeys(){ return servedKeys; } };
}

/* ============================================================
   Question translation. Four tiers, each one the backup for the one above it:

     0. bank/curated-<lang>.js - hand-written translations of the curated core (~60% of a round).
        Instant, free, offline, and the only tier whose quality is guaranteed.
     1. POST <TRANSLATE_ENDPOINT>/api/translate - the Worker translating the WHOLE question on
        Workers AI with the category and every option in one prompt, cached in KV so a question
        is only ever translated once, for everybody. This is the tier that actually understands
        context; it is optional and stays off until TRANSLATE_ENDPOINT is filled in.
     2. MyMemory - per-string, no context, guarded hard (see plausibleTranslation) because it is
        a translation-memory lookup rather than a translator.
     3. The English original, which is always a correct question.

   Nothing below tier 0 is required for the game to work, and a failure at any tier falls quietly
   to the next - there is no state in which a round stops because a translator did.

   Tier 2 detail (MyMemory - api.mymemory.translated.net, no key required). Both
   trivia sources are English-only (§6.1), so a non-English interface machine-translates each
   question's text/options right before it's shown rather than leaving them untranslated -
   confirmed live before relying on it: proper CORS headers, no key, reasonable quality.
   Best-effort throughout: any failure (network, the free daily quota running out) falls back
   to the original English string rather than blocking the round. Cached (memory + localStorage)
   since trivia questions reuse the same words constantly.
   ============================================================ */
// v2: the v1 cache was written before plausibleTranslation() existed, so it can hold the
// exact TM garbage the guardrails now reject. Bumping the key retires it.
/* ---------------- Tier 0: the hand-written locale banks ---------------- */
// Loaded on demand rather than from a <script> tag in the head: each bank is ~60-70 KB and an
// English player should never pay for one. Missing file, offline, blocked - all resolve to null
// and the chain simply carries on at tier 1.
const LOCALE_BANK_VAR = { ar: "ANSWER_IT_BANK_AR", fr: "ANSWER_IT_BANK_FR" };
const localeBankLoads = {};
function loadLocaleBank(langCode){
  const varName = LOCALE_BANK_VAR[langCode];
  if (!varName) return Promise.resolve(null);
  if (globalThis[varName]) return Promise.resolve(globalThis[varName]);
  if (localeBankLoads[langCode]) return localeBankLoads[langCode];
  localeBankLoads[langCode] = new Promise((resolve) => {
    const el = document.createElement("script");
    el.src = `bank/curated-${langCode}.js`;
    el.onload = () => resolve(globalThis[varName] || null);
    el.onerror = () => resolve(null);
    document.head.appendChild(el);
  });
  return localeBankLoads[langCode];
}
// Keyed on the exact English question text, so an entry survives the option shuffle and any
// hand-edit of the bank file. A question the bank does not cover just falls through.
function localeBankTranslation(q){
  const bank = globalThis[LOCALE_BANK_VAR[lang]];
  const entry = bank && bank[q.text];
  if (!entry) return null;
  const map = entry.o || {};
  return {
    text: entry.t,
    options: Array.isArray(q.options) && q.options.length ? q.options.map((o) => map[o] || o) : null,
    answer: map[q.correctAnswer] || q.correctAnswer,
  };
}

/* ---------------- Tier 1: the Worker (whole question, with context) ---------------- */
// Paste your deployed Worker's origin here to switch this tier on, e.g.
//   "https://answer-it-api.your-subdomain.workers.dev"
// Empty means the tier is skipped entirely - no request, no delay, no error. See worker/ and
// DEPLOY.md. Everything still works without it; the API-sourced ~40% of a round just falls back
// to MyMemory, exactly as it did before the Worker existed.
const TRANSLATE_ENDPOINT = "https://answer-it-api.nizarh393.workers.dev";
// Runtime override, mostly so a deployed build can be pointed at a `wrangler dev` Worker without
// a redeploy - in the browser console:
//   localStorage.setItem("answerit_translate_endpoint", "http://localhost:8787")
// and removeItem() to go back to whatever is baked in above.
const TRANSLATE_ENDPOINT_KEY = "answerit_translate_endpoint";
function translateEndpoint(){
  try { return localStorage.getItem(TRANSLATE_ENDPOINT_KEY) || TRANSLATE_ENDPOINT; }
  catch { return TRANSLATE_ENDPOINT; }
}
const WORKER_CACHE_KEY = "answerit_worker_translations";
const WORKER_TIMEOUT_MS = 7000;
const WORKER_MAX_FAILURES = 2; // two strikes and this tier sits out the rest of the session
const workerCache = new Map();
try {
  const saved = JSON.parse(localStorage.getItem(WORKER_CACHE_KEY) || "{}");
  for (const [k, v] of Object.entries(saved)) workerCache.set(k, v);
} catch {}
let workerFailures = 0;
function saveWorkerCache(){
  try {
    const capped = [...workerCache.entries()].slice(-400);
    localStorage.setItem(WORKER_CACHE_KEY, JSON.stringify(Object.fromEntries(capped)));
  } catch {}
}
async function workerTranslation(q){
  const endpoint = translateEndpoint();
  if (!endpoint || workerFailures >= WORKER_MAX_FAILURES) return null;
  const ck = lang + ":" + q.key;
  if (workerCache.has(ck)) return workerCache.get(ck);
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), WORKER_TIMEOUT_MS);
    const res = await fetch(endpoint.replace(/\/+$/, "") + "/api/translate", {
      method: "POST",
      headers: { "content-type": "application/json" },
      signal: controller.signal,
      body: JSON.stringify({ lang, questions: [{
        key: q.key, category: q.category, text: q.text,
        options: Array.isArray(q.options) ? q.options : [],
        answer: q.correctAnswer,
      }] }),
    });
    clearTimeout(timer);
    if (!res.ok) { workerFailures++; return null; }
    const data = await res.json();
    // A question the Worker could not translate is absent from `results` rather than an error:
    // that is a fall-through, not an outage, so it must not count as a strike.
    const value = data && data.results && data.results[q.key];
    if (!value) return null;
    workerCache.set(ck, value);
    saveWorkerCache();
    return value;
  } catch {
    workerFailures++; // not deployed, offline or too slow - stop paying the timeout every question
    return null;
  }
}

/* ---------------- Tier 2: MyMemory ---------------- */
const TRANSLATE_CACHE_KEY = "answerit_translate_cache_v2";
try { localStorage.removeItem("answerit_translate_cache"); } catch {}
const translationCache = new Map();
try {
  const saved = JSON.parse(localStorage.getItem(TRANSLATE_CACHE_KEY) || "{}");
  for (const [k, v] of Object.entries(saved)) translationCache.set(k, v);
} catch {}
let translationUnavailable = false; // sticky once MyMemory reports its daily quota is spent - stop asking

function saveTranslationCache(){
  try {
    const capped = [...translationCache.entries()].slice(-500); // bound what persists across sessions
    localStorage.setItem(TRANSLATE_CACHE_KEY, JSON.stringify(Object.fromEntries(capped)));
  } catch {}
}

async function translateOne(text, targetLang){
  if (!text || !text.trim()) return text;
  const key = targetLang + ":" + text;
  if (translationCache.has(key)) return translationCache.get(key);
  if (translationUnavailable) return text;
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 6000);
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|${targetLang}`;
    const res = await fetch(url, { signal: controller.signal });
    clearTimeout(timer);
    if (!res.ok) return text;
    const data = await res.json();
    if (data.quotaFinished) { translationUnavailable = true; return text; }
    const translated = data.responseData?.translatedText;
    if (!translated || typeof translated !== "string") return text;
    const match = Number(data.responseData?.match);
    const usable = (!Number.isFinite(match) || match >= MIN_TM_MATCH)
      && plausibleTranslation(text, translated, targetLang);
    // A rejection is cached as the English original on purpose: MyMemory is deterministic, so
    // re-asking would burn quota to get the same bad answer back.
    const result = usable ? translated : text;
    translationCache.set(key, result);
    saveTranslationCache();
    return result;
  } catch {
    return text; // offline / timed out / API hiccup - the English original is still a correct question
  }
}
// Translates one question for display in the current interface language. Scoring is never
// affected by translation quality: a choice question's correctness is the array position
// (answerIndex), which translation preserves, not the text itself. An open question keeps
// matching against the original English `correctAnswer` (the Levenshtein/whole-word-substring
// checks in matchOpenAnswer are tuned around English word shapes) and instead gets the
// translated form appended to `accepted[]`, so typing the answer in either language matches -
// `displayAnswer` is what the reveal screen shows.
// Names, titles and other proper nouns should stay as-is rather than get machine-translated -
// confirmed live this is a real failure mode, not a theoretical one: "Dream Theater" (a band)
// came back as a literal word-for-word Arabic translation instead of staying a band name, and
// "The Velvet Underground" came back as a whole descriptive sentence pulled from MyMemory's
// translation memory. Both are exactly the shape this catches: multi-word, every significant
// word capitalized - band/movie/show/book/game titles and people almost always look like that,
// and it's precisely what free MT tends to mangle. Single words and ordinary answers (country
// names, common nouns) fall through untouched and keep translating normally, since that's
// where translation is actually correct and valuable - confirmed live too: "France" -> "فرنسا"
// is the right answer, not a bug. Not perfect (no heuristic like this can be), but it removes
// the worst, most visible failure case.
// MyMemory is a translation-*memory* lookup, not a translator: on a poor match it returns the
// closest segment someone once stored, which is exactly how "The Velvet Underground" came back
// as a descriptive sentence. `match` is its own confidence in that lookup and was being thrown
// away. Anything failing these checks falls back to the English original - an untranslated
// question is still a correct question, a mistranslated one is not.
const MIN_TM_MATCH = 0.7;
const TM_NOISE = /MYMEMORY WARNING|QUERY LENGTH LIMIT|INVALID (LANGUAGE|SOURCE|TARGET)|NO QUERY SPECIFIED/i;
const TARGET_SCRIPT = { ar: /[\u0600-\u06FF]/ }; // fr shares the Latin script - nothing to assert
function plausibleTranslation(src, out, targetLang){
  const a = String(src).trim(), b = String(out).trim();
  if (!b || b === a) return false;
  if (TM_NOISE.test(b)) return false;
  if (b.length > a.length * 3 + 20) return false;   // a whole unrelated TM segment pulled in
  if (b.length * 3 + 20 < a.length) return false;   // truncated to something useless
  if (b.length > a.length * 1.5 && b.toLowerCase().includes(a.toLowerCase())) return false;
  const script = TARGET_SCRIPT[targetLang];
  if (script && !script.test(b)) return false;      // came back in English wearing a hat
  return true;
}
const MINOR_WORDS = new Set(["a","an","the","of","and","or","in","on","at","for","to","de","du","des","le","la","les","et"]);
function looksLikeProperNoun(text){
  const words = String(text).trim().split(/\s+/);
  if (words.length < 2) return false;
  const significant = words.filter(w => !MINOR_WORDS.has(w.toLowerCase().replace(/[^a-z]/gi, "")));
  if (!significant.length) return false;
  return significant.every(w => /^[A-Z0-9]/.test(w));
}
// Which categories answer with *names* rather than words. Music, screen, games and arts answer
// with bands, films, characters and titles almost every time - the exact material free MT
// mangles, and where a literal translation is wrong by definition. Geography, science, history
// and the rest answer with countries, elements and common nouns, where translating is the whole
// point ("France" -> "فرنسا" is right, not a bug). The question *text* always translates
// either way: it is prose, not a name.
const NAME_HEAVY_CATEGORIES = new Set(["music", "screen", "games", "arts"]);
const NUMERIC_OPTION = /^[\d\s.,:/'"\u2013-]+$/; // years, scores, counts - identical in every language

// looksLikeProperNoun() only ever sees one option at a time, so it cannot tell "Nirvana" the
// band from "nirvana" the noun. Judging the *set* can: if any one option is an unmistakable
// multi-word title, the options are a list of names and all four stay native. That is the
// closest thing to context this engine can be handed, and it catches the case that hurt -
// "Dream Theater / Pink Floyd / Led Zeppelin / The Velvet Underground". A set with no such
// member ("France / Spain / Italy / Poland") is left to translate normally.
function optionSetLooksLikeNames(options){
  const opts = (options || []).map(o => String(o).trim()).filter(Boolean);
  if (opts.length < 2) return false;
  if (!opts.every(o => /^[\p{Lu}\p{N}]/u.test(o))) return false;
  return opts.some(o => looksLikeProperNoun(o));
}

// Keep a string native (no network call at all, which also saves quota for the strings worth
// spending it on) when translating it would be wrong.
function shouldKeepNative(value, { category, nameSet }){
  const str = String(value ?? "").trim();
  if (!str) return true;
  if (NUMERIC_OPTION.test(str)) return true;
  if (nameSet) return true;
  if (NAME_HEAVY_CATEGORIES.has(category)) return true;
  return looksLikeProperNoun(str);
}

async function myMemoryTranslation(q){
  if (Array.isArray(q.options) && q.options.length){
    const nameSet = optionSetLooksLikeNames(q.options);
    const [text, ...options] = await Promise.all([
      translateOne(q.text, lang), // the connective question text always translates - it's prose, not a name
      ...q.options.map(o => shouldKeepNative(o, { category:q.category, nameSet })
        ? Promise.resolve(o)
        : translateOne(o, lang)),
    ]);
    return { text, options, answer: options[q.answerIndex] };
  }
  const [text, answer] = await Promise.all([
    translateOne(q.text, lang),
    shouldKeepNative(q.correctAnswer, { category:q.category, nameSet:false })
      ? Promise.resolve(q.correctAnswer)
      : translateOne(q.correctAnswer, lang),
  ]);
  return { text, options: null, answer };
}

/* ---------------- The chain ---------------- */
// First tier to return something usable wins; everything below it is the backup.
async function resolveTranslation(q){
  const fromBank = localeBankTranslation(q);
  if (fromBank) return fromBank;
  const fromWorker = await workerTranslation(q);
  if (fromWorker) return fromWorker;
  try { return await myMemoryTranslation(q); } catch { return null; }
}

// Applies a { text, options, answer } translation to a question, or leaves it in English.
// Scoring never depends on translation quality: a choice question's correctness is the array
// POSITION (answerIndex), which every tier preserves, and an open question keeps matching against
// the original English `correctAnswer` (matchOpenAnswer is tuned around English word shapes)
// while the translated form is appended to `accepted[]`, so typing it in either language works.
function applyTranslation(q, tr){
  if (!tr) return q;
  const text = (typeof tr.text === "string" && tr.text.trim()) ? tr.text : q.text;
  if (Array.isArray(q.options) && q.options.length){
    const translated = Array.isArray(tr.options) ? tr.options : null;
    // Two options collapsing onto the same string makes the question unanswerable, so the whole
    // set reverts to English rather than shipping a broken question. answerIndex is positional,
    // so it stays correct either way.
    const usable = translated
      && translated.length === q.options.length
      && translated.every(o => typeof o === "string" && o.trim())
      && new Set(translated.map(o => normalizeAnswer(o))).size === translated.length;
    const options = usable ? translated : q.options;
    return { ...q, text, options, correctAnswer: options[q.answerIndex] };
  }
  const displayAnswer = (typeof tr.answer === "string" && tr.answer.trim()) ? tr.answer : q.correctAnswer;
  const extra = normalizeAnswer(displayAnswer);
  const accepted = extra && !q.accepted.includes(extra) ? [...q.accepted, extra] : q.accepted;
  return { ...q, text, displayAnswer, accepted };
}

async function translateQuestion(q){
  if (lang === "en") return q;
  await loadLocaleBank(lang); // usually already resolved - applyLanguage() starts it at boot
  return applyTranslation(q, await resolveTranslation(q));
}

/* ============================================================
   Settings + personal bests (localStorage)
   ============================================================ */
const SETTINGS_KEY = "answerit_settings";
const PB_KEY = "answerit_pb";
const SEEN_KEY = "answerit_seen_v2"; // v1 was a bare array of provider ids. v2 is
// { contentKey: lastServedAt }, so a bucket can be sorted by *how long ago* a question was
// served rather than only by whether it ever was - see the sort at the end of buildPool().
const SEEN_CAP = 600;  // ~40 rounds of history, comfortably deeper than the whole curated bank
const SEEN_TTL_MS = 30 * 24 * 60 * 60 * 1000; // after a month a question is worth seeing again
function loadSeen(){
  try {
    const raw = JSON.parse(localStorage.getItem(SEEN_KEY));
    if (!raw || typeof raw !== "object" || Array.isArray(raw)) return new Map();
    const cutoff = Date.now() - SEEN_TTL_MS;
    return new Map(Object.entries(raw).filter(([, ts]) => typeof ts === "number" && ts > cutoff));
  } catch { return new Map(); }
}
function saveSeen(map){
  let entries = [...map.entries()].sort((a,b) => a[1] - b[1]); // oldest first, so the cap drops those
  if (entries.length > SEEN_CAP) entries = entries.slice(entries.length - SEEN_CAP);
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(Object.fromEntries(entries))); } catch {}
}
// Called the moment a question goes on screen, NOT when the round finishes. Quitting half way
// through, or reloading the tab, still counts as having seen what you saw - marking only at the
// podium meant an abandoned round left no trace at all, so "play again" straight afterwards
// served the very same questions back. That was the loudest half of the repetition complaint.
function markSeen(keys){
  const list = (Array.isArray(keys) ? keys : [keys]).filter(Boolean);
  if (!list.length) return;
  const map = loadSeen();
  const now = Date.now();
  for (const k of list) map.set(k, now);
  saveSeen(map);
}
try { localStorage.removeItem("answerit_seen"); } catch {} // v1 ids can never match a v2 key

/* Questions the APIs handed over in an earlier round and that were never actually shown. Both
   sources return a random sample skewed toward the same popular material, so "fetch again" is
   not the same thing as "get different questions" - but the tail of the previous fetch really is
   different, and it is sitting right there unused at the end of every round. Keeping it costs
   one localStorage write and saves both a network round trip and, more to the point, the
   repetition that comes from re-sampling the same slice.
   Curated questions are deliberately excluded: they are already in bank/curated-core.js, so
   storing them again would just spend the quota on questions we always have anyway. */
const CARRYOVER_KEY = "answerit_pool_carryover";
const CARRYOVER_CAP = 400;
function loadCarryover(){
  try { const a = JSON.parse(localStorage.getItem(CARRYOVER_KEY)); return Array.isArray(a) ? a : []; }
  catch { return []; }
}
function saveCarryover(list){
  try { localStorage.setItem(CARRYOVER_KEY, JSON.stringify(list.slice(-CARRYOVER_CAP))); } catch {}
}
// Everything still in the pool when a round ends is, by definition, a question nobody saw:
// makeRoundSession splices each question out of its bucket as it draws it.
function carryOverUnserved(pool){
  if (!pool) return;
  const out = [];
  for (const c of Object.keys(pool)){
    for (const L of ["easy","medium","hard"]){
      for (const q of pool[c][L] || []){
        if (q.source === "custom") continue;
        const { _seenAt, ...rest } = q; // freshness is recomputed against the seen store next time
        out.push(rest);
      }
    }
  }
  saveCarryover(out);
}
function loadSettings(){
  let s = null;
  try { s = JSON.parse(localStorage.getItem(SETTINGS_KEY)); } catch {}
  return Object.assign({ n:15, categories:[...CATEGORY_KEYS], style:"choice", intensity:"adaptive", streaks:true, hellInsurance:false, extended:false, region:"any" }, s||{});
}
function saveSettings(s){ try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch {} }
function loadPB(){
  let p = null;
  try { p = JSON.parse(localStorage.getItem(PB_KEY)); } catch {}
  return Object.assign({ overall:0, byCategory:{} }, p||{});
}
function savePB(p){ try { localStorage.setItem(PB_KEY, JSON.stringify(p)); } catch {} }

let settings = loadSettings();

function renderCatGrid(){
  $("catGrid").innerHTML = CATEGORIES.map(c => `
    <button type="button" class="cattile ${settings.categories.includes(c.key)?'on':''}" data-cat="${c.key}">

}
on($("catGrid"), "click", e => {
  const btn = e.target.closest(".cattile"); if (!btn) return;
  const key = btn.dataset.cat;
  const i = settings.categories.indexOf(key);
  if (i>-1){ if (settings.categories.length>1) settings.categories.splice(i,1); }
  else settings.categories.push(key);
  renderCatGrid(); refreshSetup();
});

function wireSeg(id, field, onChange){
  const seg = $(id);
  seg.querySelectorAll("button").forEach(b => on(b, "click", () => {
    settings[field] = b.dataset.v;
    seg.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b));
    onChange?.();
    refreshSetup();
  }));
}
wireSeg("segN", "n");
wireSeg("segStyle", "style");

wireSeg("segRegion", "region");

on($("toggleStreaks"), "change", e => { settings.streaks = e.target.checked; refreshSetup(); });
on($("toggleInsurance"), "change", e => { settings.hellInsurance = e.target.checked; refreshSetup(); });
on($("toggleExtended"), "change", e => { settings.extended = e.target.checked; refreshSetup(); });

const LEVEL_COLOR_VAR = { easy:"--lvl-easy", medium:"--lvl-medium", hard:"--lvl-hard", hell:"--lvl-hell" };
function lvlDot(level){
  return `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(${LEVEL_COLOR_VAR[level]});vertical-align:middle;margin-right:4px"></span>`;
}
function refreshSetup(){
  $("segN").querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.v==String(settings.n)));
  $("segStyle").querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.v===settings.style));
  $("segIntensity").querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.v===settings.intensity));
  $("segRegion").querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.v===settings.region));
  $("toggleStreaks").checked = settings.streaks;
  $("toggleInsurance").checked = settings.hellInsurance;

  $("mixBar").innerHTML = LEVELS.map(L => `<div style="width:${counts[L]/settings.n*100}%;background:var(${LEVEL_COLOR_VAR[L]})"></div>`).join("");
  $("mixLegend").innerHTML = LEVELS.map(L => `<span><span class="dot" style="background:var(${LEVEL_COLOR_VAR[L]})"></span>${esc(levelName(L))} ${counts[L]}</span>`).join("");
  $("intensityNote").textContent = settings.intensity==="adaptive" ? t("intensityNoteAdaptive") : t("intensityNoteFixed");

    warn.classList.add("hide"); $("startRoundBtn").disabled = false;

}

on($("setupBack"), "click", () => show("screen-menu"));

/* ============================================================
   Round flow
   ============================================================ */
let R = null; // active round runtime state

function newRoundState(){
  return {
    session:null, pool:null, current:null, qIndexShown:0, isDoubleNow:false,
    score:0, streak:0, bestStreak:0, correctCount:0, answeredCount:0,
    avgMsSum:0, byCategory:{}, log:[], startAt:0, questionStartAt:0, locked:false,
    timerHandle:null, servedLevelsForAwards:[],
  };
}

function progressText(p){ return p.key==="toppingUp" ? t("toppingUp", p.i, p.total) : t(p.key); }
function noticeText(n){ return n.key==="toppedUpFrom" ? t("toppedUpFrom", levelName(n.level), levelName(n.nearest)) : t(n.key); }

let loadingCancelFlag = false;
on($("loadingCancel"), "click", () => { loadingCancelFlag = true; show("screen-setup"); });

on($("startRoundBtn"), "click", async () => {
  show("screen-loading");
  loadingCancelFlag = false;
  $("loadingSub").textContent = t("fetchingQuestions");
  $("loadingCancel").classList.remove("hide");
  try {
    const pool = await buildPool(settings.categories, settings.n, p => $("loadingSub").textContent = progressText(p), () => loadingCancelFlag, settings.region);
    const total = LEVELS.filter(L=>L!=="hell").reduce((s,L)=>s+poolTotal(pool, settings.categories, L), 0);
    if (total < Math.min(6, settings.n)){
      $("errorMsg").textContent = t("errorTooLittle");
      show("screen-error"); return;
    }
    R = newRoundState();
    R.pool = pool;
    R.session = makeRoundSession(pool, settings);
    R.startAt = Date.now();
    advanceRound();
  } catch (err){
    if (err instanceof RoundCancelled) return; // loadingCancel already navigated back to setup
    $("errorMsg").textContent = t("errorUnreachable");
    show("screen-error");
  }
});
on($("errorRetry"), "click", () => $("startRoundBtn").click());
on($("errorMenu"), "click", () => show("screen-menu"));

async function advanceRound(){
  if (!R.isDoubleNow && R.qIndexShown >= settings.n){
    R.isDoubleNow = true;
    let dq = R.session.buildDouble();
    if (!dq){ toast(t("ranOutDouble")); finishRound(); return; }
    dq = await translateQuestion(dq);
    showInterstitial("dbl", dq);
    return;
  }
  if (R.isDoubleNow){ finishRound(); return; }

  let q = R.session.nextQuestion();
  if (!q){
    // Pool truly exhausted despite the upfront adequacy check (§20: never invent questions -
    // ending a few short is the honest fallback, but the player is told, not left guessing).
    toast(t("ranOutFresh", R.qIndexShown));
    finishRound();
    return;
  }
  R.session.notices.forEach(n => toast(noticeText(n)));
  R.session.notices.length = 0;
  R.qIndexShown++;
  q = await translateQuestion(q);
  if (q.level==="hell"){ showInterstitial("hell", q); return; }
  showQuestion(q);
}

function showInterstitial(kind, q){
  if (kind==="hell"){
    const mod = q.modifiers?.[0];
    $("hellSub").textContent = mod==="rush" ? t("hellRush", q.timeLimit)
      : mod==="blind" ? t("hellBlind")
      : t("hellBasePoints");
    $("hellCard").classList.remove("hide");
    setTimeout(() => { $("hellCard").classList.add("hide"); showQuestion(q); }, reduceMotion ? 400 : 1600);
  } else {
    $("dblSub").textContent = t("doubleSub", R.score.toLocaleString());
    $("dblCard").classList.remove("hide");
    setTimeout(() => { $("dblCard").classList.add("hide"); showQuestion(q); }, reduceMotion ? 400 : 1800);
  }
}

function showQuestion(q){
  R.current = q; R.locked = false;
  markSeen(q.key); // on screen = seen, whatever happens to the round from here
  show("screen-question");
  const chip = $("qLevelChip");
  chip.textContent = levelName(q.level) + (q.isDouble ? " ×2" : "");
  chip.style.background = `var(${LEVEL_COLOR_VAR[q.level]})`;
  $("qCatChip").innerHTML = `${icon(CAT_BY_KEY[q.category].icon)} ${catLabel(q.category)}`;
  $("qProgress").textContent = q.isDouble ? t("theDouble") : t("questionOf", R.qIndexShown, settings.n);
  $("qText").textContent = q.text;

  const pill = $("streakPill");
  if (settings.streaks && R.streak>0){
    pill.classList.remove("hide");
    $("streakVal").textContent = R.streak;
    $("streakMult").textContent = "×" + streakMultiplier(R.streak).toFixed(1);
  } else pill.classList.add("hide");

  const optGrid = $("qOptions"), openRow = $("qOpenRow"), lockedNote = $("qLockedNote");
  lockedNote.classList.add("hide");
  if (q.type==="choice"){
    optGrid.classList.remove("hide"); openRow.classList.add("hide");
    const shapes = ["tri","dia","cir","sq"]; const colors = ["--shape-a","--shape-b","--shape-c","--shape-d"];
    optGrid.innerHTML = q.options.map((opt,i) => `
      <button type="button" class="opt" data-i="${i}" style="--opt-color:var(${colors[i%4]})">
        <span class="opt-shape ${shapes[i%4]}"></span>
        <span class="opt-key">${i+1}</span>
        <span class="opt-text">${esc(opt)}</span>
        <span class="opt-mark hide"></span>
      </button>`).join("");
    optGrid.querySelectorAll(".opt").forEach(b => on(b, "click", () => submitAnswer(Number(b.dataset.i))));
  } else {
    optGrid.classList.add("hide"); openRow.classList.remove("hide");
    const input = $("qOpenInput");
    input.value = ""; input.disabled = false; $("qOpenSubmit").disabled = false; input.focus();
  }

  R.questionStartAt = performance.now();
  startTimer(q.timeLimit, q.level);
}

function startTimer(seconds, level){
  const fill = $("timerFill");
  fill.style.transition = "none"; fill.style.transform = "scaleX(1)";
  fill.style.background = `var(${LEVEL_COLOR_VAR[level]})`;
  void fill.offsetWidth;
  if (!reduceMotion){
    requestAnimationFrame(() => { fill.style.transition = `transform ${seconds}s linear`; fill.style.transform = "scaleX(0)"; });
  }
  const endAt = performance.now() + seconds*1000;
  $("timerLabel").textContent = seconds;
  let announced10=false, announced5=false;
  clearInterval(R.timerHandle);
  R.timerHandle = setInterval(() => {
    if (R.locked){ clearInterval(R.timerHandle); return; }
    const left = Math.max(0, endAt - performance.now());
    const s = Math.ceil(left/1000);
    $("timerLabel").textContent = s;
    if (reduceMotion) fill.style.transform = `scaleX(${left/(seconds*1000)})`;
    if (s<=10 && !announced10){ announced10=true; $("timerAnnounce").textContent = t("secondsLeft", 10); }
    if (s<=5 && !announced5){ announced5=true; $("timerAnnounce").textContent = t("secondsLeft", 5); }
    if (left<=0){ clearInterval(R.timerHandle); $("timerAnnounce").textContent = t("timesUp"); onTimeout(); }
  }, 100);
}

function lockInputs(){
  $("qOptions").querySelectorAll(".opt").forEach(b => b.disabled = true);
  $("qOpenInput").disabled = true;
  $("qOpenSubmit").disabled = true;
}
function onTimeout(){
  if (R.locked) return;
  R.locked = true;
  lockInputs();
  finishAnswer({ verdict:"wrong", ms: R.current.timeLimit*1000, submittedText:"" });
}
on($("qOpenSubmit"), "click", () => submitOpen());
on($("qOpenInput"), "keydown", e => { if (e.key==="Enter") submitOpen(); });
function submitOpen(){
  const val = $("qOpenInput").value.trim();
  if (!val){ return; }
  submitAnswer(val);
}
function submitAnswer(value){
  if (R.locked) return;
  R.locked = true;
  clearInterval(R.timerHandle);
  lockInputs();
  const q = R.current;
  const ms = clamp(performance.now() - R.questionStartAt, 0, q.timeLimit*1000);
  let verdict, submittedText;
  if (q.type==="choice"){
    verdict = value===q.answerIndex ? "correct" : "wrong";
    submittedText = q.options[value];
    const optEls = $("qOptions").querySelectorAll(".opt");
    optEls.forEach((el,i) => {
      if (i===q.answerIndex) el.classList.add("correct");
      else if (i===value) el.classList.add("wrong");
      else el.classList.add("dim");
    });
  } else {
    verdict = matchOpenAnswer(value, q.correctAnswer, q.accepted);
    submittedText = value;
    $("qOpenInput").blur();
  }
  finishAnswer({ verdict, ms, submittedText });
}

function finishAnswer({ verdict, ms, submittedText }){
  const q = R.current;
  const disputeAutoResolved = verdict==="dispute"; // solo has no host - auto-resolve generous (§11, §20)
  const correct = verdict!=="wrong";

  const result = scoreAnswer({
    level:q.level, type:q.type, isDouble:!!q.isDouble, responseTimeMs: ms,
    streakBefore: settings.streaks ? R.streak : 0, correct,
    hellInsurance: settings.hellInsurance,
  });
  R.score += result.points;
  R.streak = settings.streaks ? result.streakAfter : 0;
  R.bestStreak = Math.max(R.bestStreak, R.streak);
  R.answeredCount++;
  R.avgMsSum += ms;
  if (correct) R.correctCount++;
  R.session.recordOutcome(correct);
  R.servedLevelsForAwards.push(q.level);

  const bc = (R.byCategory[q.category] ||= { c:0, n:0 });
  bc.n++; if (correct) bc.c++;

  R.log.push({ text:q.text, category:q.category, level:q.level, isDouble:!!q.isDouble, submittedText, correctAnswer:q.displayAnswer||q.correctAnswer, correct, points:result.points, ms });

  renderReveal(q, { verdict, correct, ms, result, disputeAutoResolved });
}

function renderReveal(q, { verdict, correct, ms, result, disputeAutoResolved }){
  const chip = $("rLevelChip");
  chip.textContent = levelName(q.level) + (q.isDouble ? " ×2" : "");
  chip.style.background = `var(${LEVEL_COLOR_VAR[q.level]})`;
  $("rCatChip").innerHTML = `${icon(CAT_BY_KEY[q.category].icon)} ${catLabel(q.category)}`;
  $("rAnswer").textContent = q.displayAnswer || q.correctAnswer;
  $("rDisputeNote").classList.toggle("hide", !disputeAutoResolved);

  $("rMark").innerHTML = icon(correct ? "check" : "x");
  $("rMark").className = "mark " + (correct ? "ok" : "no");
  $("rPoints").textContent = (correct ? "+" : "") + result.points.toLocaleString();
  $("rTime").textContent = fmtMs(ms);
  $("rStreak").textContent = R.streak;
  $("rMultWrap").classList.toggle("hide", !correct || result.multiplier<=1);
  $("rMult").textContent = result.multiplier.toFixed(1);
  $("rScore").textContent = R.score.toLocaleString();

  const pill = $("streakPill");
  if (correct && settings.streaks && R.streak>0){ pill.classList.remove("hide"); pill.classList.add("bump"); setTimeout(()=>pill.classList.remove("bump"), 420); }

  show("screen-reveal");
}

/* ============================================================
   Podium
   ============================================================ */
function finishRound(){
  carryOverUnserved(R.pool);
  const pb = loadPB();
  let isNewOverall = R.score > (pb.overall||0);
  if (isNewOverall) pb.overall = R.score;
  let catPB = false;
  if (settings.categories.length===1){
    const key = settings.categories[0];
    const prev = pb.byCategory[key]||0;
    if (R.score > prev){ pb.byCategory[key] = R.score; catPB = true; }
  }
  savePB(pb);

  $("finalScore").textContent = R.score.toLocaleString();
  $("pbBadge").classList.toggle("hide", !(isNewOverall || catPB));
  $("pbBadge").innerHTML = icon("partyPopper") + " " + esc(catPB ? t("newPersonalBestInCategory", catLabel(settings.categories[0])) : t("newPersonalBest"));

  $("catBreakdown").innerHTML = Object.entries(R.byCategory).map(([key, s]) => `
    <div class="catrow">
      <div class="name">${icon(CAT_BY_KEY[key].icon)} ${catLabel(key)}</div>
      <div class="bar"><div style="width:${s.n?Math.round(s.c/s.n*100):0}%"></div></div>
      <div class="frac">${s.c}/${s.n}</div>
    </div>`).join("") || `<p style="color:var(--muted);font-size:13px">${esc(t("noQuestionsAnswered"))}</p>`;

  $("awardsList").innerHTML = computeAwards().map(a => `<div>${a}</div>`).join("") || `<p style="color:var(--muted);font-size:13px">${esc(t("playFullRoundForAwards"))}</p>`;

  $("reviewList").innerHTML = R.log.map(l => `
    <div class="reviewrow" title="${esc(l.text)}">
      <span class="rmark" style="color:${l.correct?'var(--lvl-easy)':'var(--lvl-hell)'}">${icon(l.correct?"circleCheck":"circleX")}</span>
      <span class="rtext">${esc(l.text)}${l.correct ? "" : esc(t("youAnswerFmt", l.submittedText || t("noAnswer"), l.correctAnswer))}</span>
      <span style="color:var(--muted);flex:none">${l.correct?"+":""}${l.points}</span>
    </div>`).join("");

  show("screen-podium");
  confetti.burst();
}

function computeAwards(){
  const awards = [];
  if (R.avgMsSum>0 && R.answeredCount>0) {
    const avg = R.avgMsSum/R.answeredCount;
    if (avg < 4000) awards.push(icon("timer") + " " + esc(t("fastestFinger", (avg/1000).toFixed(1))));
  }
  if (R.bestStreak>=5) awards.push(icon("snowflake") + " " + esc(t("iceCold", R.bestStreak)));
  if (R.log.some(l => l.level==="hell" && l.correct)) awards.push(icon("skull") + " " + esc(t("againstAllOdds")));
  for (const [key,s] of Object.entries(R.byCategory)) if (s.n>=3 && s.c===s.n) awards.push(icon("target") + " " + esc(t("specialist", catLabel(key))));
  return awards;
}

/* ============================================================
   Multiplayer rooms (§11-§17) - Worker + Durable Object client. Mirrors find-it-site's MP
   pattern (permanent per-device player id, API_BASE + /api/rooms, a WebSocket per room) with
   the additions Answer It's game needs on top: a clock-offset ping/pong handshake so every
   player's countdown reads the same wall-clock moment (§17), and a lot more phases (judging,
   teams, spectators) than Find It's plain waiting/playing/finished.

   Scoring, level mix, streak multiplier etc. are never computed here - the server (room.js,
   sharing game-core.js with solo) is the sole source of truth; this code only renders whatever
   the DO sends and forwards taps/keystrokes back to it.
   ============================================================ */
const ROOM_API_BASE = "https://answer-it-api.nizarh393.workers.dev";
const ROOM_API_BASE_KEY = "answerit_room_endpoint";
function roomApiBase(){
  try { return localStorage.getItem(ROOM_API_BASE_KEY) || ROOM_API_BASE; } catch { return ROOM_API_BASE; }
}

const RM_ID_KEY = "answerit_player";
function rmLoadIdentity(){
  let me = null;
  try { me = JSON.parse(localStorage.getItem(RM_ID_KEY)); } catch {}
  if (!me || !me.id) me = { id: crypto.randomUUID ? crypto.randomUUID() : "p-"+Date.now()+"-"+Math.random().toString(36).slice(2), nickname:"" };
  return me;
}
function rmSaveIdentity(){ try { localStorage.setItem(RM_ID_KEY, JSON.stringify(RM.me)); } catch {} }

const RM = {
  me: rmLoadIdentity(), ws:null, code:null, reconnecting:false, leavingIntentionally:false,
  state:null, question:null, clockOffset:0, minRtt:Infinity, pingTimer:null,
  timerHandle:null, spectatorJoin:false,
};

function rmSend(msg){ if (RM.ws && RM.ws.readyState===1) RM.ws.send(JSON.stringify(msg)); }
function rmIsHost(){ return !!RM.state && RM.state.hostId===RM.me.id; }
function rmMyRole(){ return RM.state?.you?.role || "player"; }

/* ---------------- entry screen ---------------- */
function rmBuildCodeInputs(){
  const el = $("roomJoinInputs");
  el.innerHTML = "";
  for (let i=0;i<6;i++){
    const inp = document.createElement("input");
    inp.maxLength = 1; inp.inputMode = "numeric"; inp.autocomplete = "off";
    on(inp, "input", () => {
      inp.value = /^[0-9]$/.test(inp.value) ? inp.value : "";
      if (inp.value && i<5) el.children[i+1].focus();
    });
    on(inp, "keydown", e => {
      if (e.key==="Backspace" && !inp.value && i>0) el.children[i-1].focus();
      else if (e.key==="Enter") $("roomJoinBtn").click();
    });
    on(inp, "paste", e => {
      e.preventDefault();
      const clean = (e.clipboardData.getData("text")||"").replace(/\D/g,"");
      for (let k=0; k+i<6 && k<clean.length; k++) el.children[i+k].value = clean[k];
      el.children[Math.min(5,i+clean.length)].focus();
    });
    el.appendChild(inp);
  }
}
function rmReadCode(){ return [...$("roomJoinInputs").children].map(i=>i.value).join(""); }
function rmNameMsg(msg){ const el=$("roomNameMsg"); el.textContent=msg; el.classList.toggle("hide", !msg); }

/* ---------------- connection ---------------- */
function rmConnect(code, { spectator=false } = {}){
  RM.code = code; RM.spectatorJoin = spectator; RM.leavingIntentionally = false;
  RM.clockOffset = 0; RM.minRtt = Infinity; RM._lbRanks = null;
  if (RM.ws){ try { RM.ws.close(); } catch {} }
  let url = roomApiBase().replace(/^http/,"ws") + `/api/rooms/${code}/socket?playerId=${encodeURIComponent(RM.me.id)}&nickname=${encodeURIComponent(RM.me.nickname)}`;
  if (spectator) url += "&role=spectator";
  const ws = new WebSocket(url);
  RM.ws = ws;
  ws.addEventListener("message", ev => {
    let data; try { data = JSON.parse(ev.data); } catch { return; }
    rmOnMessage(data);
  });
  ws.addEventListener("open", () => { clearInterval(RM.pingTimer); rmPing(); RM.pingTimer = setInterval(rmPing, 4000); });
  ws.addEventListener("close", () => {
    clearInterval(RM.pingTimer);
    if (RM.ws!==ws) return;
    if (RM.leavingIntentionally){ RM.ws=null; return; }
    if (!RM.state){
      RM.code=null; RM.ws=null;
      rmClearActiveCode();
      rmShowHome();
      rmEntryMsg(t("couldntJoinRoom"));
      return;
    }
    if (RM.code && !RM.reconnecting){
      RM.reconnecting = true;
      setTimeout(() => { RM.reconnecting=false; if (RM.code) rmConnect(RM.code, { spectator: RM.spectatorJoin }); }, 1500);
    }
  });
  ws.addEventListener("error", () => {});
}
function rmPing(){
  const t0 = Date.now(), p0 = performance.now();
  RM._pingT0 = t0; RM._pingP0 = p0;
  rmSend({ type:"ping", t:t0 });
}
function rmLeaveRoom(){
  RM.leavingIntentionally = true;
  rmSend({ type:"leave" });
  if (RM.ws){ try { RM.ws.close(); } catch {} }
  RM.ws=null; RM.code=null; RM.state=null; RM.question=null;
  clearInterval(RM.pingTimer);
  clearInterval(RM.timerHandle);
  document.body.classList.remove("spectating");
  rmClearActiveCode();
  show("screen-menu");
}

// The settings/info panel available from every mid-game room screen: the code, so a friend - or
// this same player reconnecting on another device - can join, plus who is currently in the room.
// Joining/reconnecting itself needs no new plumbing here: a fresh player who submits
// this code lands in handleSocket exactly like one who joined from the lobby (spectator until the
// next round, §20), and this device's own reconnect-with-score-intact already happens automatically
// (rmConnect's close handler + the saved RM_CODE_KEY on boot) - this panel just surfaces the code.
function rmOpenRoomInfo(){
  const s = RM.state; if (!s) return;
  const code = s.code || RM.code || "";

    <div class="prow ${p.connected?"":"offline"} ${p.id===RM.me.id?"me":""}">

    </div>
