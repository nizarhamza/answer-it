<html lang="en">
<head>
<meta charset="UTF-8">

<title>Answer It - Trivia, Fast</title>
<meta name="description" content="Answer It - a fast, loud trivia game. Four levels, streak multipliers, and a Double worth 2x on the last question.">
<meta name="theme-color" content="#15151b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Answer It">

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ANSWER IT - design tokens
   Same theming discipline as Find It (CSS-var light/dark pairs, Fredoka display +
   Outfit text) but louder: solid, always-vivid level/shape colours instead of quiet
   feedback pegs - see ANSWER-IT.md §1 "Brand personality".
   ============================================================ */
:root, [data-theme="dark"]{
  --bg:#15151b;
  --panel:#1f1f27;
  --raise:#262631;
  --sunk:#1a1a22;
  --line:#34343f;
  --line-strong:#47475a;
  --text:#f4f2ec;
  --muted:#9c98ab;
  --accent:#6d28d9;
  --accent-2:#ffb020;
  --on-accent:#ffffff;
  --focus:rgba(109,40,217,.35);
  --scrim:rgba(10,10,14,.75);
  --shadow:0 30px 80px rgba(0,0,0,.55);
  --shadow-card:0 1px 2px rgba(0,0,0,.3), 0 18px 40px -28px rgba(0,0,0,.9);
  --radius:22px;
  --radius-sm:14px;
  --pill:999px;
}
[data-theme="light"]{
  --bg:#f3efe6;
  --panel:#ffffff;
  --raise:#f7f4ed;
  --sunk:#ffffff;
  --line:#e4dfd2;
  --line-strong:#cfc8b6;
  --text:#26232e;
  --muted:#726c80;
  --accent:#6d28d9;
  --accent-2:#a8690a;
  --on-accent:#ffffff;
  --focus:rgba(109,40,217,.22);
  --scrim:rgba(38,35,46,.45);
  --shadow:0 30px 70px rgba(38,35,46,.22);
  --shadow-card:0 1px 2px rgba(38,35,46,.05), 0 18px 40px -28px rgba(38,35,46,.35);
}
/* Level + option-shape colours are deliberately identical in both themes - solid fills with
   white text, same reasoning as Find It's --mark-* tokens: these are fixed identity colours,
   not theme-adaptive text-on-background colours. Depth chosen to clear WCAG AA (4.5:1) with
   white text (matches common "700"-depth swatches). */
:root{
  --lvl-easy:#15803d; --lvl-medium:#1d4ed8; --lvl-hard:#c2410c; --lvl-hell:#b91c1c;
  --shape-a:#b91c1c; --shape-b:#1d4ed8; --shape-c:#a16207; --shape-d:#15803d;
}

*{box-sizing:border-box}
.icon{width:1em;height:1em;display:inline-block;flex:none;vertical-align:-.125em}
.spinner{width:48px;height:48px}
.spinner svg{width:100%;height:100%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner svg{animation:none}}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  transition:background-color .3s ease,color .3s ease;
}
h1,h2,h3,.display{font-family:"Fredoka",system-ui,sans-serif;font-weight:600;margin:0}
button{font-family:inherit}
p{margin:0}
.hide{display:none !important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

#fx{position:fixed;inset:0;pointer-events:none;z-index:80}

/* ---------------- Layout shell ---------------- */
.screen{min-height:100%;display:none;flex-direction:column}
.screen.active{display:flex}
#app{min-height:100vh;display:flex;flex-direction:column}
.wrap{max-width:640px;margin:0 auto;width:100%;padding:20px;flex:1;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px}
.iconbtn{width:42px;height:42px;border-radius:var(--pill);border:none;background:var(--raise);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
.iconbtn:hover{background:var(--line)}
.langsel{position:relative}
.langsel-btn{
  height:42px;border-radius:var(--pill);border:none;background:var(--raise);color:var(--text);
  padding:0 14px 0 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;gap:10px;
}
.langsel-btn:hover{background:var(--line)}
.langsel-arrow{width:16px;height:16px;flex:none;color:var(--muted);transition:transform .2s cubic-bezier(.16,1,.3,1)}
.langsel-btn[aria-expanded="true"] .langsel-arrow{transform:rotate(180deg)}

.langsel-list{
  position:absolute;top:calc(100% + 8px);left:0;z-index:20;min-width:168px;margin:0;padding:6px;
  list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);
  box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:2px;
  transform-origin:top left;animation:langsel-in .16s cubic-bezier(.16,1,.3,1);
}
.langsel-list[hidden]{display:none}
[dir="rtl"] .langsel-list{left:auto;right:0;transform-origin:top right}
@keyframes langsel-in{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.langsel-list{animation:none}}
.langsel-opt{
  padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--text);
  cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.langsel-opt:hover, .langsel-opt:focus-visible{background:var(--raise);outline:none}
.langsel-opt[aria-selected="true"]{color:var(--accent)}
.langsel-opt[aria-selected="true"]::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}

/* ---------------- Wordmark ---------------- */
.wordmark{
  font-size:clamp(40px,10vw,64px);
  font-weight:700;
  background:linear-gradient(90deg,var(--lvl-easy),var(--lvl-medium) 38%,var(--lvl-hard) 68%,var(--lvl-hell));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  letter-spacing:-.02em;
}
.tagline{color:var(--muted);font-size:16px;margin-top:4px}

/* ---------------- Buttons ---------------- */
.btn{
  font-weight:600;border:none;border-radius:var(--radius-sm);padding:14px 20px;font-size:15px;
  cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;
  transition:transform .15s ease, box-shadow .15s ease, background .2s ease, opacity .2s ease;
  color:var(--text);background:var(--raise);
}
.btn:active{transform:scale(.97)}
.btn:hover{background:var(--line)}
.btn-primary{background:var(--accent);color:var(--on-accent);box-shadow:0 10px 24px -10px rgba(109,40,217,.55)}
.btn-primary:hover{background:#7c3aed}
.btn-lg{padding:18px 26px;font-size:18px;border-radius:var(--radius);width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none !important}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1}
.link-btn{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px;padding:4px}

/* ---------------- Cards / panels ---------------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-card)}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:10px}

/* ---------------- Segmented control ---------------- */
/* flex-wrap:wrap so a label too long for its row (a translated revealPace option in particular -
   "L'hôte clique sur Suivant", "المضيف يضغط التالي" - both run well past the English "Host clicks
   Next") drops to its own line instead of refusing to shrink below its nowrap text width and
   overlapping the button next to it. */
.seg{display:flex;flex-wrap:wrap;background:var(--sunk);border:1px solid var(--line);border-radius:var(--pill);padding:4px;gap:4px}
.seg button{flex:1;border:none;background:transparent;color:var(--muted);padding:10px 12px;border-radius:var(--pill);font-weight:600;cursor:pointer;font-size:13px;white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--on-accent)}

/* ---------------- Toggle switch ---------------- */
.togglerow{display:flex;align-items:center;justify-content:space-between;padding:10px 2px;gap:12px}
.togglerow .lbl{font-weight:500}
.togglerow .sub{font-size:12px;color:var(--muted);margin-top:2px}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.switch .track{position:absolute;inset:0;background:var(--sunk);border:1px solid var(--line-strong);border-radius:var(--pill);transition:background .2s}
.switch .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .2s, background .2s}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track .knob{transform:translateX(20px);background:#fff}
.switch input:disabled + .track{opacity:.4}

/* ---------------- Category grid ---------------- */
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.cattile{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 6px;border-radius:var(--radius-sm);background:var(--raise);border:2px solid transparent;cursor:pointer;color:var(--text);font-size:12px;font-weight:600;text-align:center}
.cattile.on{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 16%, var(--raise))}
.cattile .icon{width:22px;height:22px}

/* ---------------- Mix bar ---------------- */
.mixbar{display:flex;height:14px;border-radius:var(--pill);overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.mixbar > div{height:100%;transition:width .3s ease}
.mixlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.mixlegend span.dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}

/* ---------------- Question screen ---------------- */
.qtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--pill);font-size:13px;font-weight:600;background:var(--raise);color:var(--text)}
.chip-level{color:#fff;text-transform:uppercase}
.progress-txt{color:var(--muted);font-size:13px;margin-left:auto}
.timerbar{height:10px;border-radius:var(--pill);background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.timerbar-fill{height:100%;width:100%;transform-origin:left;transform:scaleX(1);border-radius:var(--pill)}
.timer-label{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;color:var(--muted)}
.streakpill{margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:linear-gradient(90deg,var(--accent),#a855f7);color:#fff;padding:6px 12px;border-radius:var(--pill);font-weight:700;font-size:13px}
.streakpill.bump{animation:pillbump .4s ease}
@keyframes pillbump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.qtext{font-family:"Fredoka";font-weight:600;font-size:clamp(20px,5vw,28px);line-height:1.25;margin:6px 0}

.optgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.optgrid{grid-template-columns:1fr}}
.opt{
  display:flex;align-items:center;gap:10px;padding:16px 14px;border-radius:var(--radius-sm);
  border:none;cursor:pointer;color:#fff;background:var(--opt-color);font-size:15px;font-weight:600;
  text-align:left;transition:transform .12s ease, filter .15s ease, opacity .2s ease;min-height:64px;
}
.opt:hover{filter:brightness(1.08)}
.opt:active{transform:scale(.98)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.35}
.opt.correct{outline:3px solid #fff;outline-offset:2px}
.opt.wrong{outline:3px solid rgba(255,255,255,.6);outline-offset:2px;filter:saturate(.5)}
.opt-shape{width:20px;height:20px;background:#fff;flex:none}
.opt-shape.tri{clip-path:polygon(50% 6%, 6% 94%, 94% 94%)}
.opt-shape.dia{clip-path:polygon(50% 2%, 98% 50%, 50% 98%, 2% 50%)}
.opt-shape.cir{border-radius:50%}
.opt-shape.sq{border-radius:4px}
.opt-key{font-size:12px;opacity:.85;font-weight:700}
.opt-text{flex:1}
.opt-mark{font-size:16px}

.openrow{display:flex;gap:10px}
.openinput{flex:1;padding:16px;border-radius:var(--radius-sm);border:2px solid var(--line);background:var(--sunk);color:var(--text);font-size:17px;font-family:inherit}
.openinput:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--focus)}
.lockednote{color:var(--muted);font-size:14px;text-align:center;padding:20px}

/* ---------------- Interstitials ---------------- */
.interstitial{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:30px;color:#fff}
.interstitial.hell{background:radial-gradient(circle at 50% 30%, #7a1414, #2b0505 75%)}
.interstitial.dbl{background:radial-gradient(circle at 50% 30%, #4c1d95, #150626 75%)}
.interstitial .big{font-family:"Fredoka";font-weight:700;font-size:clamp(40px,12vw,80px);letter-spacing:.02em}
.interstitial .sub{font-size:18px;opacity:.9;max-width:420px}
.interstitial .flame{font-size:clamp(50px,14vw,90px);animation:flicker 1.1s ease-in-out infinite}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.08) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.interstitial .flame{animation:none}}

/* ---------------- Reveal ---------------- */
.reveal-answer{font-family:"Fredoka";font-weight:600;font-size:22px;text-align:center;padding:10px 0}
.reveal-result{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--radius-sm);background:var(--raise)}
.reveal-result .mark{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;color:#fff}
.reveal-result .mark.ok{background:var(--lvl-easy)}
.reveal-result .mark.no{background:var(--lvl-hell)}
.reveal-stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.reveal-stats b{color:var(--text)}
.notice{font-size:13px;color:var(--accent-2);background:color-mix(in srgb, var(--accent-2) 14%, var(--panel));border:1px solid color-mix(in srgb, var(--accent-2) 30%, transparent);border-radius:var(--radius-sm);padding:10px 12px}

/* ---------------- Podium ---------------- */
.finalscore{font-family:"Fredoka";font-weight:700;font-size:clamp(44px,12vw,72px);text-align:center;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.pbbadge{text-align:center;font-weight:700;color:var(--lvl-easy)}
.catrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:none}
.catrow .name{width:130px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.catrow .bar{flex:1;height:10px;background:var(--sunk);border-radius:var(--pill);overflow:hidden}
.catrow .bar > div{height:100%;background:var(--lvl-easy);border-radius:var(--pill)}
.catrow .frac{font-size:12.5px;color:var(--muted);width:44px;text-align:right}
.reviewlist{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto}
.reviewrow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);background:var(--raise);font-size:13px}
.reviewrow .rtext{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reviewrow .rmark{flex:none}

/* ---------------- Modal ---------------- */
.modal-scrim{position:fixed;inset:0;background:var(--scrim);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border-radius:var(--radius);max-width:480px;width:100%;max-height:80vh;overflow-y:auto;padding:24px;box-shadow:var(--shadow)}
.modal h2{margin-bottom:12px}

/* ---------------- Toast ---------------- */
#toast-wrap{position:fixed;bottom:18px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 18px;border-radius:var(--pill);box-shadow:var(--shadow-card);font-size:13.5px;font-weight:500;animation:toastin .25s ease}
@keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ---------------- RTL (Arabic) ----------------
   Flexbox rows already mirror for free under dir="rtl" (row-reversal is direction-aware by
   spec), which covers most of this page's layout automatically, question content included -
   it's translated per translateQuestion() when the interface isn't English, so it's
   no longer pinned LTR the way English-only content would be. What's left here is the
   handful of physical (not logical) left/right properties below, plus the lvlDot() marker
   whose gap sits on whichever side is now "before" the text it labels. */
[dir="rtl"] .progress-txt{margin-left:0;margin-right:auto}
[dir="rtl"] .streakpill{margin-left:0;margin-right:auto}
[dir="rtl"] .mixlegend span.dot{margin-right:0;margin-left:5px}
[dir="rtl"] .catrow .frac{text-align:left}

/* ---------------- Rooms (multiplayer) ---------------- */
/* Entry flow (name -> home) is one centred panel per screen, not several stacked .card
   blocks - mirrors find-it-site's .mp-modal/.mp-screen rhythm (see its DEPLOY-adjacent
   comment "an inline card ... not a popup dialog"), just in Answer It's own card/token
   language instead of copying its CSS verbatim. */
.rm-panel{max-width:480px;margin:0 auto;width:100%;text-align:center;padding:40px 36px}
@media (max-width:560px){ .rm-panel{padding:30px 22px} }
@media (max-width:380px){ .codeinputs{gap:6px} .codeinputs input{width:36px;height:46px;font-size:18px} }
.rm-panel h2{margin-bottom:10px;font-size:clamp(22px,5vw,28px)}
.rm-sub{color:var(--muted);font-size:14.5px;line-height:1.6;margin:0 0 26px}
.rm-name-input{
  width:100%;box-sizing:border-box;padding:17px 18px;border-radius:var(--pill);text-align:center;
  border:2px solid var(--line);background:var(--sunk);color:var(--text);font-family:inherit;
  font-size:17px;margin-bottom:20px;
}
.rm-name-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--focus)}
.rm-edit{border:0;background:transparent;color:var(--muted);cursor:pointer;font-family:inherit;font-size:14px;padding:2px 8px;display:inline-flex;align-items:center;gap:5px;vertical-align:middle}
.rm-edit:hover{color:var(--accent)}
.rm-edit .icon{width:15px;height:15px}
.rm-divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:11.5px;margin:28px 0 20px;text-transform:uppercase;letter-spacing:.12em}
.rm-divider::before,.rm-divider::after{content:"";flex:1;height:1px;background:var(--line)}
#screen-room-home .codeinputs{margin-bottom:20px}
#screen-room-home .btn-lg + .link-btn{margin-top:18px;display:inline-block}
.roomcode{font-family:"Fredoka";font-weight:700;font-size:clamp(36px,10vw,52px);letter-spacing:.08em;text-align:center;color:var(--accent);cursor:pointer;user-select:all}
.roomcode-hint{text-align:center;font-size:12.5px;color:var(--muted)}
.codeinputs{display:flex;gap:9px;justify-content:center}
.codeinputs input{width:46px;height:56px;text-align:center;font-size:23px;font-weight:700;border-radius:var(--radius-sm);border:2px solid var(--line);background:var(--sunk);color:var(--text);font-family:"Fredoka",inherit}
.codeinputs input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--focus)}
.plist{display:flex;flex-direction:column;gap:6px}
/* Lobby's player list is a grid, not a stacked list - a room fills with more names than
   disputes ever will, and a grid reads at a glance instead of scrolling. Scoped to the id
   (rather than changing .plist itself) because judgeDisputes reuses .plist and needs the
   plain stacked layout - a dispute row (nickname + quoted answer + verdict buttons) doesn't fit
   a narrow grid cell the way a bare nickname does. */
#lobbyPlayers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.prow{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--raise);font-size:13.5px;flex-wrap:wrap}
.prow.me{outline:2px solid var(--accent);outline-offset:-2px}
.prow .pname{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.prow.offline{opacity:.5}
.badge{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:var(--pill);background:var(--sunk);color:var(--muted)}
.badge.host{background:var(--accent);color:#fff}
.teamdot{width:10px;height:10px;border-radius:50%;flex:none}
.teamgrid{display:flex;gap:8px;flex-wrap:wrap}
.teamchip{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:var(--pill);border:2px solid transparent;background:var(--raise);color:var(--text);font-weight:600;font-size:13px;cursor:pointer}
.teamchip.on{border-color:var(--accent)}
.answered-ticker{color:var(--muted);font-size:13px;text-align:center}
.leaderboard{display:flex;flex-direction:column;gap:6px}
.lbrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);background:var(--raise);transition:transform .3s ease}
.lbrow .rank{width:22px;font-family:"Fredoka";font-weight:600;color:var(--muted);flex:none}
.lbrow .lbname{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow .lbscore{font-family:"Fredoka";font-weight:600}
.dist-list{display:flex;flex-direction:column;gap:12px}
.dist-row{display:flex;align-items:center;gap:12px;font-size:14px}
.dist-row .dist-label{width:auto;max-width:40%;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.dist-row .dist-bar{flex:1;height:28px;background:var(--sunk);border-radius:var(--radius-sm);overflow:hidden}
.dist-row .dist-bar>div{height:100%;transition:width .4s ease}
.dist-row .dist-n{width:30px;text-align:end;color:var(--muted);font-weight:600;flex:none}
.rank-arrow{display:inline-flex;flex:none;width:16px;height:16px}
.rank-arrow.up{color:var(--lvl-medium)}
.rank-arrow.down{color:var(--lvl-hell)}
.lbrow{position:relative}
.lbrow.rank-bump{animation:rankbump .5s ease}
@keyframes rankbump{0%{transform:scale(1)}30%{transform:scale(1.03)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.lbrow.rank-bump{animation:none}}

/* Podium - top 3 revealed bottom-to-top with a pause between each (§9/§18: "podium reveals
   bottom-to-top... confetti for first"). Each stand starts invisible/dropped and gets `.show`
   added on its turn; the CSS transition is what makes that read as a rise rather than a snap. */
.podium3{display:flex;align-items:flex-end;justify-content:center;gap:12px;min-height:210px;padding:0 4px}
.pd-stand{
  display:flex;flex-direction:column;align-items:center;gap:6px;width:100px;flex:none;
  opacity:0;transform:translateY(28px) scale(.92);
  transition:opacity .5s ease, transform .55s cubic-bezier(.34,1.56,.64,1);
}
.pd-stand.show{opacity:1;transform:translateY(0) scale(1)}
.pd-stand[data-rank="1"]{order:2}
.pd-stand[data-rank="2"]{order:1}
.pd-stand[data-rank="3"]{order:3}
.pd-name{font-weight:700;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.pd-score{font-family:"Fredoka";font-weight:600;font-size:15px;color:var(--muted)}
.pd-block{
  width:100%;border-radius:14px 14px 4px 4px;display:flex;align-items:flex-start;justify-content:center;
  padding-top:10px;font-size:30px;box-shadow:0 10px 20px -12px rgba(0,0,0,.5);
}
.pd-stand[data-rank="1"] .pd-block{height:132px;background:linear-gradient(180deg,#fde047,#ca8a04)}
.pd-stand[data-rank="2"] .pd-block{height:96px;background:linear-gradient(180deg,#e2e8f0,#94a3b8)}
.pd-stand[data-rank="3"] .pd-block{height:68px;background:linear-gradient(180deg,#fbbf7d,#b45309)}
.pd-stand[data-rank="1"] .pd-name{font-size:16px}
@media (prefers-reduced-motion:reduce){.pd-stand{transition:none}}
@media (max-width:420px){ .pd-stand{width:80px} .pd-name{font-size:12.5px} }

.openword{display:flex;flex-wrap:wrap;gap:6px}
.openword span{padding:5px 10px;border-radius:var(--pill);background:var(--raise);font-size:12.5px}
.openword span.correct{background:var(--lvl-easy);color:#fff}
.judgerow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--raise)}
.judgerow .jtext{flex:1;font-size:14px}
.judgerow .jname{font-weight:600;font-size:12.5px;color:var(--muted)}
.judge-actions{display:flex;gap:6px}
.judge-actions button{width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center}
.judge-actions .yes{background:var(--lvl-easy)}
.judge-actions .no{background:var(--lvl-hell)}
.judge-actions button.picked{outline:3px solid var(--text);outline-offset:2px}
body.spectating .qtext{font-size:clamp(26px,6vw,40px)}
body.spectating .optgrid, body.spectating .openrow{display:none !important}
.spectator-note{text-align:center;color:var(--muted);font-size:14px;padding:16px}

/* ---------------- Motion / a11y ---------------- */
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<canvas id="fx" class="hide"></canvas>
<div id="toast-wrap" aria-live="polite"></div>

<div id="app">

  <!-- ============== MENU ============== -->
  <section class="screen active" id="screen-menu">
    <div class="topbar">
      <div class="langsel" id="langSel">
        <button type="button" class="langsel-btn" id="langSelBtn" aria-haspopup="listbox" aria-expanded="false" data-i18n-title="language" data-i18n-aria="language">
          <span id="langSelLabel">English</span>
          <span class="langsel-arrow" data-icon="chevronDown"></span>
        </button>
        <ul class="langsel-list" id="langSelList" role="listbox" tabindex="-1" hidden>
          <li role="option" class="langsel-opt" data-value="en" aria-selected="true" tabindex="-1">English</li>
          <li role="option" class="langsel-opt" data-value="fr" aria-selected="false" tabindex="-1">Français</li>
          <li role="option" class="langsel-opt" data-value="ar" aria-selected="false" tabindex="-1">العربية</li>
        </ul>
      </div>
      <button class="iconbtn" id="themeBtn" data-i18n-title="toggleTheme" data-i18n-aria="toggleTheme"></button>
    </div>
    <div class="wrap" style="justify-content:center;text-align:center;gap:26px">
      <div>
        <h1 class="wordmark">Answer It</h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <button class="btn btn-primary btn-lg" id="menuPlaySolo"><span data-icon="play"></span> <span data-i18n="playSolo"></span></button>
        <button class="btn btn-lg" id="menuRooms"><span data-icon="users"></span> <span data-i18n="roomsMenuLabel"></span></button>
      </div>
      <div style="display:flex;gap:18px;justify-content:center;flex-wrap:wrap">
        <button class="link-btn" id="menuHowTo" data-i18n="howToPlay"></button>
        <button class="link-btn" id="menuCredits" data-i18n="credits"></button>
      </div>
    </div>
  </section>

  <!-- ============== SOLO SETUP ============== -->
  <section class="screen" id="screen-setup">
    <div class="topbar">
      <button class="iconbtn" id="setupBack" data-icon="arrowLeft" data-i18n-aria="back"></button>
      <h2 style="font-size:18px" data-i18n="soloRoundTitle"></h2>
      <span style="width:42px"></span>
    </div>
    <div class="wrap">

      <div class="card">
        <div class="section-title" data-i18n="categoriesTitle"></div>
        <div class="catgrid" id="catGrid"></div>
        <p style="font-size:12px;color:var(--muted);margin-top:10px" data-i18n="questionsLanguageNote"></p>
      </div>

      <div class="card">
        <div class="section-title" data-i18n="questionsTitle"></div>
        <div class="seg" id="segN">
          <button data-v="10">10</button>
          <button data-v="15">15</button>
          <button data-v="20">20</button>
          <button data-v="30">30</button>
        </div>
      </div>

      <div class="card">
        <div class="section-title" data-i18n="answerStyleTitle"></div>
        <div class="seg" id="segStyle">
          <button data-v="choice" data-i18n="styleChoice"></button>
          <button data-v="open" data-i18n="styleOpen"></button>
          <button data-v="mixed" data-i18n="styleMixed"></button>
        </div>
      </div>

      <div class="card">
        <div class="section-title" data-i18n="intensityTitle"></div>
        <div class="seg" id="segIntensity">
          <button data-v="chill" data-i18n="intensityChill"></button>
          <button data-v="standard" data-i18n="intensityStandard"></button>
          <button data-v="brutal" data-i18n="intensityBrutal"></button>
          <button data-v="adaptive" data-i18n="intensityAdaptive"></button>
        </div>

        <div class="mixbar" id="mixBar" style="margin-top:6px"></div>
        <div class="mixlegend" id="mixLegend" style="margin-top:8px"></div>
      </div>

      <div class="card">
        <div class="section-title" data-i18n="regionTitle"></div>
        <div class="seg" id="segRegion" style="flex-wrap:wrap">
          <button data-v="any" data-i18n="regionAny"></button>
          <button data-v="africa" data-i18n="regionAfrica"></button>
          <button data-v="asia" data-i18n="regionAsia"></button>
          <button data-v="latam" data-i18n="regionLatam"></button>
          <button data-v="mena" data-i18n="regionMena"></button>
          <button data-v="europe" data-i18n="regionEurope"></button>
          <button data-v="na" data-i18n="regionNa"></button>
        </div>
        <p style="font-size:12.5px;color:var(--muted);margin-top:10px" data-i18n="regionNote"></p>
      </div>

      <div class="card">
        <div class="togglerow">
          <div><div class="lbl" data-i18n="streaksLabel"></div><div class="sub" data-i18n="streaksSub"></div></div>
          <label class="switch"><input type="checkbox" id="toggleStreaks" checked><span class="track"><span class="knob"></span></span></label>
        </div>
        <div class="togglerow">
          <div><div class="lbl" data-i18n="hellInsuranceLabel"></div><div class="sub" data-i18n="hellInsuranceSub"></div></div>
          <label class="switch"><input type="checkbox" id="toggleInsurance"><span class="track"><span class="knob"></span></span></label>
        </div>
        <div class="togglerow">
          <div><div class="lbl" data-i18n="extendedTimeLabel"></div><div class="sub" data-i18n="extendedTimeSub"></div></div>
          <label class="switch"><input type="checkbox" id="toggleExtended"><span class="track"><span class="knob"></span></span></label>
        </div>
      </div>

      <p class="notice hide" id="setupWarning"></p>
      <button class="btn btn-primary btn-lg" id="startRoundBtn">Start - 15 + The Double</button>
    </div>
  </section>

  <!-- ============== LOADING ============== -->
  <section class="screen" id="screen-loading">
    <div class="wrap" style="justify-content:center;align-items:center;text-align:center;gap:16px">
      <div class="spinner" id="loadingSpinner" data-icon="loaderCircle" style="color:var(--accent)"></div>
      <h2 data-i18n="buildingRound"></h2>
      <p style="color:var(--muted)" id="loadingSub"></p>
      <button class="link-btn hide" id="loadingCancel" data-i18n="cancel"></button>
    </div>
  </section>

  <!-- ============== ERROR ============== -->
  <section class="screen" id="screen-error">
    <div class="wrap" style="justify-content:center;align-items:center;text-align:center;gap:14px">
      <div data-icon="wifiOff" style="width:44px;height:44px;color:var(--muted)"></div>
      <h2 data-i18n="couldntLoad"></h2>
      <p style="color:var(--muted)" id="errorMsg"></p>
      <button class="btn btn-primary" id="errorRetry" data-i18n="tryAgain"></button>
      <button class="link-btn" id="errorMenu" data-i18n="backToMenu"></button>
    </div>
  </section>

  <!-- ============== QUESTION ============== -->
  <section class="screen" id="screen-question">
    <div class="wrap" style="gap:14px">
      <div class="qtop">
        <span class="chip chip-level" id="qLevelChip">EASY</span>
        <span class="chip" id="qCatChip">General</span>
        <span class="progress-txt" id="qProgress">Question 1 of 15</span>
      </div>
      <div class="streakpill hide" id="streakPill" style="margin-left:0"><span data-icon="flame"></span> <span id="streakVal">0</span> <span id="streakWordEl" data-i18n="streakWord"></span> · <span id="streakMult">×1.0</span></div>
      <div>
        <div class="timerbar"><div class="timerbar-fill" id="timerFill"></div></div>
        <div style="display:flex;justify-content:space-between;margin-top:4px">
          <span class="timer-label"><span id="timerLabel">15</span>s</span>
          <span class="sr-only" id="timerAnnounce" aria-live="assertive"></span>
        </div>
      </div>
      <h2 class="qtext" id="qText"></h2>

      <div class="optgrid" id="qOptions"></div>

      <div class="openrow hide" id="qOpenRow">
        <input class="openinput" id="qOpenInput" type="text" autocomplete="off" autocorrect="off" spellcheck="false" data-i18n-placeholder="typeYourAnswer" data-i18n-aria="yourAnswerAria">
        <button class="btn btn-primary" id="qOpenSubmit"><span data-i18n="send"></span> <span data-icon="send"></span></button>
      </div>
      <p class="lockednote hide" id="qLockedNote"><span data-icon="hourglass"></span> <span data-i18n="lockedWaiting"></span></p>
    </div>
  </section>

  <!-- ============== REVEAL ============== -->
  <section class="screen" id="screen-reveal">
    <div class="wrap" style="gap:14px" aria-live="polite">
      <div class="qtop">
        <span class="chip chip-level" id="rLevelChip">EASY</span>
        <span class="chip" id="rCatChip">General</span>
      </div>
      <p style="color:var(--muted);font-size:13px" data-i18n="correctAnswerLabel"></p>
      <p class="reveal-answer" id="rAnswer">-</p>
      <p class="notice hide" id="rDisputeNote"><span data-icon="scale"></span> <span data-i18n="disputeNote"></span></p>

      <div class="reveal-result">
        <span class="mark" id="rMark"></span>
        <div style="flex:1">
          <div style="font-weight:700;font-size:20px" id="rPoints">+600</div>
          <div class="reveal-stats">
            <span><b id="rTime">1.2s</b></span>
            <span><span id="streakWordEl2" data-i18n="streakWord"></span> <b id="rStreak">2</b></span>
            <span id="rMultWrap">×<b id="rMult">1.1</b></span>
          </div>
        </div>
      </div>

      <div class="card" style="display:flex;justify-content:space-between;align-items:center">
        <span style="color:var(--muted);font-size:13px" data-i18n="scoreLabel"></span>
        <span style="font-family:'Fredoka';font-weight:600;font-size:22px" id="rScore">0</span>
      </div>

      <button class="btn btn-primary btn-lg" id="revealNext">Next <span data-icon="arrowRight"></span></button>
    </div>
  </section>

  <!-- ============== PODIUM ============== -->
  <section class="screen" id="screen-podium">
    <div class="wrap" style="gap:18px">
      <h2 style="text-align:center;display:flex;align-items:center;justify-content:center;gap:10px"><span data-i18n="roundComplete"></span> <span data-icon="flag"></span></h2>
      <p class="finalscore" id="finalScore">0</p>
      <p class="pbbadge hide" id="pbBadge"></p>

      <div class="card">
        <div class="section-title" data-i18n="perCategoryAccuracy"></div>
        <div id="catBreakdown"></div>
      </div>

      <div class="card">
        <div class="section-title" data-i18n="awardsTitle"></div>
        <div id="awardsList" style="display:flex;flex-direction:column;gap:8px;font-size:14px"></div>
      </div>

      <div class="card">
        <div class="section-title" data-i18n="reviewYourAnswers"></div>
        <div class="reviewlist" id="reviewList"></div>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="podiumRematch"><span data-icon="repeat"></span> <span data-i18n="playAgain"></span></button>
        <button class="btn" id="podiumSettings"><span data-icon="settings"></span> <span data-i18n="changeSettings"></span></button>
      </div>
      <button class="link-btn" id="podiumMenu" data-i18n="backToMenu"></button>
    </div>

  <!-- ============== ROOM: NAME ============== -->

      <button class="iconbtn" id="roomNameBack" data-icon="arrowLeft" data-i18n-aria="back"></button>

    <div class="wrap" style="justify-content:center">

        <p class="rm-sub" data-i18n="nicknameSub"></p>

        <p class="notice hide" id="roomNameMsg"></p>
        <button class="btn btn-primary btn-lg" id="roomNameContinueBtn" data-i18n="continueBtn"></button>
      </div>
    </div>
  </section>

  <!-- ============== ROOM: HOME (create / join) ============== -->

      <button class="iconbtn" id="roomHomeBack" data-icon="arrowLeft" data-i18n-aria="back"></button>

    </div>
    <div class="wrap" style="justify-content:center">

  <!-- ============== ROOM: LOBBY ============== -->

      <div class="card">

      </div>

      <div class="card hide" id="lobbyTeamsCard">
        <div class="section-title" data-i18n="pickYourTeam"></div>

      </div>

      <div id="lobbySettingsHost" class="hide">
        <div class="card">
          <div class="section-title" data-i18n="categoriesTitle"></div>
          <div class="catgrid" id="lobbyCatGrid"></div>
        </div>
        <div class="card">
          <div class="section-title" data-i18n="questionsTitle"></div>
          <div class="seg" id="lobbySegN">
            <button data-v="10">10</button><button data-v="15">15</button><button data-v="20">20</button><button data-v="30">30</button>
          </div>
        </div>
        <div class="card">
          <div class="section-title" data-i18n="answerStyleTitle"></div>
          <div class="seg" id="lobbySegStyle">
            <button data-v="choice" data-i18n="styleChoice"></button>
            <button data-v="open" data-i18n="styleOpen"></button>
            <button data-v="mixed" data-i18n="styleMixed"></button>
          </div>
        </div>
        <div class="card">
          <div class="section-title" data-i18n="intensityTitle"></div>
          <div class="seg" id="lobbySegIntensity">
            <button data-v="chill" data-i18n="intensityChill"></button>
            <button data-v="standard" data-i18n="intensityStandard"></button>
            <button data-v="brutal" data-i18n="intensityBrutal"></button>
            <button data-v="adaptive" data-i18n="intensityAdaptive"></button>
          </div>
          <div class="mixbar" id="lobbyMixBar" style="margin-top:10px"></div>
        </div>
        <div class="card">
          <div class="section-title" data-i18n="regionTitle"></div>
          <div class="seg" id="lobbySegRegion" style="flex-wrap:wrap">
            <button data-v="any" data-i18n="regionAny"></button>
            <button data-v="africa" data-i18n="regionAfrica"></button>
            <button data-v="asia" data-i18n="regionAsia"></button>
            <button data-v="latam" data-i18n="regionLatam"></button>
            <button data-v="mena" data-i18n="regionMena"></button>
            <button data-v="europe" data-i18n="regionEurope"></button>
            <button data-v="na" data-i18n="regionNa"></button>
          </div>
          <p style="font-size:12.5px;color:var(--muted);margin-top:10px" data-i18n="regionNote"></p>
        </div>
        <div class="card">
          <div class="section-title" data-i18n="questionLanguageTitle"></div>
          <div class="seg" id="lobbySegQLang">
            <button data-v="en">English</button><button data-v="fr">Français</button><button data-v="ar">العربية</button>
          </div>
          <p style="font-size:12.5px;color:var(--muted);margin-top:10px" data-i18n="questionsLanguageNote"></p>
        </div>
        <div class="card">
          <div class="togglerow">
            <div><div class="lbl" data-i18n="streaksLabel"></div></div>
            <label class="switch"><input type="checkbox" id="lobbyToggleStreaks" checked><span class="track"><span class="knob"></span></span></label>
          </div>
          <div class="togglerow">

const LANG_KEY = "answerit_lang";
// Each language's own name, in its own script - always shown as-is, never translated
// (the point is to be findable by someone who doesn't yet read the current interface language).
const LANG_NAMES = { en: "English", fr: "Français", ar: "العربية" };
function detectLanguage(){
  try { const saved = localStorage.getItem(LANG_KEY); if (saved && I18N[saved]) return saved; } catch {}

  return candidates.find(c => I18N[c]) || "en";
}
let lang = detectLanguage();
function t(key, ...args){
  const dict = I18N[lang] || I18N.en;

}
// Back/Next are the only icons whose *meaning* (not just position) depends on reading

// dir="rtl", but an arrow that means "back" has to visibly point the other way in Arabic.

const THEME_KEY = "answerit_theme";
let savedTheme = null;
try { savedTheme = localStorage.getItem(THEME_KEY); } catch {}
const prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
let theme = savedTheme === "light" || savedTheme === "dark" ? savedTheme : (prefersLight ? "light" : "dark");
let themeLocked = theme === savedTheme;
function applyTheme(t){
  theme = t;
  document.documentElement.setAttribute("data-theme", t);
  $("themeBtn").innerHTML = icon(t === "dark" ? "moon" : "sun");
}
applyTheme(theme);
on($("themeBtn"), "click", () => {
  themeLocked = true;

  try { localStorage.setItem(THEME_KEY, theme); } catch {}
});
if (window.matchMedia){
  const mq = window.matchMedia("(prefers-color-scheme: light)");
  const onChange = e => { if (!themeLocked) applyTheme(e.matches ? "light" : "dark"); };
  mq.addEventListener ? mq.addEventListener("change", onChange) : mq.addListener(onChange);
}
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
/* ---------------- Language dropdown ----------------
   Custom listbox instead of a native <select>: the browser's own option-list chrome can't be
   themed (light/dark tokens, focus states) or reliably kept in sync with RTL, so this mirrors
   the standard listbox pattern (button + role="listbox", roving focus, Esc/outside-click to
   close) while staying keyboard- and screen-reader-navigable. */
(() => {
  const wrap = $("langSel"), btn = $("langSelBtn"), list = $("langSelList");
  if (!wrap || !btn || !list) return;
  const opts = () => Array.from(list.querySelectorAll(".langsel-opt"));
  function closeList(){
    if (list.hidden) return;
    list.hidden = true;
    btn.setAttribute("aria-expanded", "false");
  }
  function openList(){
    list.hidden = false;
    btn.setAttribute("aria-expanded", "true");
    const items = opts();
    (items.find(o => o.getAttribute("aria-selected") === "true") || items[0])?.focus();
  }
  on(btn, "click", () => { list.hidden ? openList() : closeList(); });
  on(btn, "keydown", (e) => {
    if ((e.key === "ArrowDown" || e.key === "ArrowUp" || e.key === "Enter" || e.key === " ") && list.hidden){
      e.preventDefault(); openList();
    }
  });
  opts().forEach(o => on(o, "click", () => { applyLanguage(o.dataset.value); closeList(); btn.focus(); }));
  on(list, "keydown", (e) => {
    const items = opts();
    const i = items.indexOf(document.activeElement);
    if (e.key === "ArrowDown"){ e.preventDefault(); (items[i+1] || items[0]).focus(); }
    else if (e.key === "ArrowUp"){ e.preventDefault(); (items[i-1] || items[items.length-1]).focus(); }
    else if (e.key === "Enter" || e.key === " "){ e.preventDefault(); document.activeElement.click(); }
    else if (e.key === "Escape"){ closeList(); btn.focus(); }
    else if (e.key === "Tab"){ closeList(); }
  });
  on(document, "click", (e) => { if (!wrap.contains(e.target)) closeList(); });
})();

   ============================================================ */
const confetti = (() => {
  const cv = $("fx");
  const ctx = cv.getContext ? cv.getContext("2d") : null;
  if (!ctx) return { burst(){}, stop(){} };
  const themeColors = () => {
    const cs = getComputedStyle(document.documentElement);
    const v = n => (cs.getPropertyValue(n) || "").trim();
    return [v("--lvl-easy"), v("--lvl-medium"), v("--lvl-hard"), v("--lvl-hell"), v("--accent"), v("--accent-2")].filter(Boolean);
  };
  let COLORS = ["#39d98a","#6ea8ff","#b58cff","#ffc247","#ff6b6b","#ffffff"];
  let parts = [], raf = null;
  function size(){
    const d = window.devicePixelRatio || 1;
    cv.width = innerWidth * d; cv.height = innerHeight * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  addEventListener("resize", () => { if (raf) size(); });
  function spawn(count, originX){
    for (let i = 0; i < count; i++){
      parts.push({
        x: originX, y: innerHeight * 0.42 + (Math.random() - .5) * 40,
        vx: (Math.random() - .5) * 13, vy: -6 - Math.random() * 11,
        w: 6 + Math.random() * 7, h: 9 + Math.random() * 9,
        rot: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
        c: COLORS[(Math.random() * COLORS.length) | 0], life: 1
      });
    }
  }
  function frame(){
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 60);
    for (const p of parts){
      p.vy += 0.32; p.vx *= 0.995; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if (p.y > innerHeight * 0.75) p.life -= 0.012;
      ctx.save(); ctx.globalAlpha = Math.max(0, p.life);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * (0.4 + 0.6 * Math.abs(Math.cos(p.rot))));
      ctx.restore();
    }
    if (parts.length) raf = requestAnimationFrame(frame); else stop();
  }
  function burst(){
    if (reduceMotion) return;
    size();
    const tc = themeColors(); if (tc.length) COLORS = tc;
    cv.classList.remove("hide");
    spawn(70, innerWidth * 0.25); spawn(70, innerWidth * 0.75);
    setTimeout(() => spawn(60, innerWidth * 0.5), 220);
    setTimeout(() => { spawn(45, innerWidth * 0.15); spawn(45, innerWidth * 0.85); }, 520);
    if (!raf) raf = requestAnimationFrame(frame);
  }
  function stop(){
    if (raf) cancelAnimationFrame(raf);
    raf = null; parts = [];
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    cv.classList.add("hide");
  }
  return { burst, stop };
})();

/* ============================================================
   GAME CORE - mirrors worker/src/game-core.js exactly (kept in sync by hand; that file is
   the reference copy). Duplicated here - not imported - because a real ES module import
   across files is blocked by CORS the moment this page is opened via file:// instead of
   http(s), and "open index.html and it works, no server" is a deliberate property of solo
   play (see ANSWER-IT.md §6.2). See worker/src/game-core.js for section-by-section citations.

const LEVELS = ["easy", "medium", "hard", "hell"];

const TIME_LIMITS = { choice: { easy:15, medium:20, hard:25, hell:35 }, open: { easy:25, medium:30, hard:35, hell:45 } };
const STREAK_GAIN = { easy:1, medium:1, hard:1, hell:2 };
const PROFILES = {
  chill:    { easy:.55, medium:.30, hard:.12, hell:.03 },
  standard: { easy:.40, medium:.35, hard:.20, hell:.05 },
  brutal:   { easy:.20, medium:.30, hard:.35, hell:.15 },
};
const ADAPTIVE_BOUNDS = {
  easy:{floor:.15,ceiling:.55}, medium:{floor:.20,ceiling:.45}, hard:{floor:.10,ceiling:.40}, hell:{floor:.03,ceiling:.15},
};

function streakMultiplier(streak){ return Math.min(1 + Math.max(0, streak - 1) * 0.1, 1.5); }
function timeFactor(responseTimeMs, timeLimitS){
  const f = 1 - 0.5 * (responseTimeMs / (timeLimitS*1000));
  return clamp(f, 0.5, 1);
}
function scoreAnswer({ level, type, isDouble, responseTimeMs, streakBefore, correct, hellInsurance }){
  if (!correct){
    const insured = hellInsurance && level === "hell" && streakBefore >= 3;
    return { points:0, streakAfter: insured ? 1 : 0, timeFactor:0, multiplier:0 };
  }
  const limit = TIME_LIMITS[type][level];
  const tf = timeFactor(responseTimeMs, limit);
  const streakAfter = streakBefore + STREAK_GAIN[level];
  const mult = streakMultiplier(streakAfter);
  const doubleMult = isDouble ? 2 : 1;
  const points = Math.round(BASE_POINTS[level] * tf * mult * doubleMult);
  return { points, streakAfter, timeFactor: tf, multiplier: mult };
}
function allocateCounts(n, profile){
  const raw={}, floor={}, rem={};
  for (const L of LEVELS){ raw[L]=n*profile[L]; floor[L]=Math.floor(raw[L]); rem[L]=raw[L]-floor[L]; }
  let leftover = n - LEVELS.reduce((s,L)=>s+floor[L],0);
  const order = [...LEVELS].sort((a,b)=>(rem[b]-rem[a])||(LEVELS.indexOf(b)-LEVELS.indexOf(a)));
  for (let i=0;i<leftover;i++) floor[order[i]]++;
  if (n>=8){
    for (const L of LEVELS){
      while (floor[L]===0){
        const donor = LEVELS.reduce((a,b)=>floor[a]>=floor[b]?a:b);
        if (floor[donor]<=1) break;
        floor[donor]--; floor[L]++;

    }
  }
  return floor;
}
function rollingAccuracy(outcomes){
  const last5 = outcomes.slice(-5);
  if (!last5.length) return 0.60;
  return last5.filter(Boolean).length / last5.length;
}

    let delta=0;

      const {floor,ceiling} = ADAPTIVE_BOUNDS[L];
      if (p[L]>ceiling){ delta += p[L]-ceiling; p[L]=ceiling; pinned.add(L); }
      else if (p[L]<floor){ delta -= floor-p[L]; p[L]=floor; pinned.add(L); }
    }
    if (Math.abs(delta)<1e-9) break;
    const free = LEVELS.filter(L=>!pinned.has(L));
    if (!free.length) break;
    const freeTotal = free.reduce((s,L)=>s+p[L],0);
    for (const L of free) p[L] += freeTotal>0 ? delta*(p[L]/freeTotal) : delta/free.length;
  }

}
function adaptiveProfile(accuracy){
  const s = clamp((accuracy-0.60)*0.8, -0.35, 0.35);
  return clampRenormalize({
    easy: PROFILES.standard.easy - 0.6*s, medium: PROFILES.standard.medium - 0.4*s,
    hard: PROFILES.standard.hard + 0.7*s, hell: PROFILES.standard.hell + 0.3*s,
  });
}
function levelEligibleAt(level, pos, n, placedLevels){
  const third = Math.ceil(n/3);
  if (pos===0) return level==="easy";
  if (level==="hell" && pos<third) return false;
  if (level==="hell" && placedLevels[placedLevels.length-1]==="hell") return false;
  if (level==="hard" && pos<third && n-pos>third) return false;
  const last2 = placedLevels.slice(-2);
  if (last2.length===2 && last2[0]===level && last2[1]===level) return false;
  return true;

function pickHellQuestion(hardPool, { allowBlind }){
  // hardPool arrives fresh-first from buildPool, so sample a front window rather than the whole
  // list: the niche set is the smallest pool in the game and a repeat there is the one players
  // notice most.
  const front = arr => {
    let span = Math.max(1, Math.min(arr.length, Math.max(3, Math.ceil(arr.length * 0.5))));
    const fresh = arr.filter(q => !q._seenAt).length; // 0 when nothing is stamped (multiplayer)
    if (fresh >= 2) span = Math.min(span, fresh);
    return arr[Math.floor(Math.random() * span)];
  };
  const niche = hardPool.filter(q=>q.isNiche);
  if (niche.length) return { question: front(niche), modifier: null };
  if (!hardPool.length) return null;
  const base = front(hardPool);
  const modifier = allowBlind && Math.random()<0.5 ? "blind" : "rush";
  return { question: base, modifier };
}
function applyHellModifier(question, modifier){
  const q = { ...question, level:"hell", modifiers: modifier ? [modifier] : [] };
  if (modifier==="blind"){ q.type="open"; q.options=null; }

}

  const base = TIME_LIMITS[q.type][q.level];
  const withRush = q.modifiers?.includes("rush") ? Math.round(base*0.6) : base;
  return extended ? Math.round(withRush*1.5) : withRush;
}
function doubleLevel(servedLevels){
  const maxIdx = servedLevels.reduce((m,L)=>Math.max(m, LEVELS.indexOf(L)), 0);
  return LEVELS[Math.min(maxIdx+1, LEVELS.length-1)];

// Arabic "ال" is a prefix with no space after it, so it is stripped inside
// normalizeAnswer() rather than listed here.
const LEADING_ARTICLES = /^(the|a|an|le|la|les|un|une)\s+/;
const FRENCH_ELISION = /^(l|d|s|n|j|m|t|c|qu)['’]/;

// Arabic writes the same word several ways, and a player typing an answer will not happen to
// pick the form the translator emitted: ة vs ه, ى vs ي, ٱ vs ا, an optional ال, tatweel
// stretching, Arabic-Indic digits for the Latin ones. Folding all of them is safe because both
// sides of every comparison come through here - the cost is two genuinely different answers
// folding together, which is far rarer than the near-miss it fixes.
function foldArabic(s){
  return s
    .replace(/\u0640/g, "")                            // tatweel (ـ) - pure decoration
    .replace(/[\u0622\u0623\u0625\u0671]/g, "\u0627")  // آ أ إ ٱ -> ا
    .replace(/\u0629/g, "\u0647")                      // ة -> ه
    .replace(/\u0649/g, "\u064A")                      // ى -> ي
    .replace(/[\u0660-\u0669]/g, d => String.fromCharCode(d.charCodeAt(0) - 0x0660 + 48))
    .replace(/[\u06F0-\u06F9]/g, d => String.fromCharCode(d.charCodeAt(0) - 0x06F0 + 48));
}
function normalizeAnswer(input){
  let s = String(input).toLowerCase().replace(FRENCH_ELISION, "");
  s = s.normalize("NFD").replace(/\p{Diacritic}/gu, "");
  s = foldArabic(s);
  s = s.replace(/[^\p{L}\p{N}\s]/gu, "");
  s = s.replace(/\s+/g," ").trim();
  s = s.replace(LEADING_ARTICLES, "").trim();

  // word that merely starts with those two letters is left alone.
  s = s.replace(/^\u0627\u0644(?=[\u0600-\u06FF]{3,})/, "");

}

// it from one source never stopped the other copy turning up in the next round. The normalised
// question text is the one thing all three sources share, so that - not the id - is what

  ["south korea","korea","republic of korea"],

  ["china","peoples republic of china","prc"],

    for (let j=1;j<=n;j++) cur[j] = a[i-1]===b[j-1] ? prev[j-1] : 1+Math.min(prev[j],cur[j-1],prev[j-1]);
    prev=cur;
  }
  return prev[n];
}
function wordsToNumber(str){
  const words = String(str).toLowerCase().replace(/-/g," ").replace(/\band\b/g," ").split(/\s+/).filter(Boolean);
  if (!words.length) return null;
  let total=0,current=0,matched=false;
  for (const w of words){
    if (w in ONES){ current+=ONES[w]; matched=true; }
    else if (w in TENS){ current+=TENS[w]; matched=true; }
    else if (w==="hundred"){ current=(current||1)*100; matched=true; }
    else if (w==="thousand"){ total+=(current||1)*1000; current=0; matched=true; }
    else if (w==="million"){ total+=(current||1)*1000000; current=0; matched=true; }
    else return null;
  }
  return matched ? total+current : null;
}
function toNumber(s){
  const cleaned = String(s).replace(/,/g,"").trim();
  if (cleaned!=="" && !isNaN(Number(cleaned))) return Number(cleaned);
  return wordsToNumber(s);
}
function matchOpenAnswer(submitted, correctAnswer, accepted){
  const subN = normalizeAnswer(submitted);
  if (!subN) return "wrong";
  const ansN = normalizeAnswer(correctAnswer);
  if (subN===ansN || accepted.includes(subN)) return "correct";
  const dist = levenshtein(subN, ansN);
  const len = ansN.length || 1;
  if (dist <= Math.ceil(len/6)) return "correct";
  const subNum = toNumber(submitted), ansNum = toNumber(correctAnswer);
  if (subNum!==null && ansNum!==null && subNum===ansNum) return "correct";
  const wholeWordHit = new RegExp(`(^|\\s)${ansN.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}(\\s|$)`).test(subN);
  if (dist <= Math.ceil(len/3) || wholeWordHit) return "dispute";
  return "wrong";
}

async function fetchJson(url, timeoutMs=8000){

async function fetchTriviaApi({categories=[], tags=[], limit=50, difficulties=["easy","medium","hard"]}={}){
