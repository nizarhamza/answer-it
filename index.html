    <div class="section-title" style="margin-bottom:8px">${esc(t("playersTitle"))}</div>
    <div class="plist" style="margin-bottom:16px">${rows}</div>
    <div style="text-align:end"><button class="btn btn-primary" id="modalRoomInfoClose">${esc(t("close"))}</button></div>
  `);
  on($("modalRoomInfoClose"), "click", closeModal);
  on($("modalRoomCode"), "click", () => {
    if (navigator.clipboard) navigator.clipboard.writeText(code).then(()=>toast(t("tapToCopy")+" ✓")).catch(()=>{});
  });
}
document.querySelectorAll(".rm-settings-btn").forEach(b => on(b, "click", rmOpenRoomInfo));
document.querySelectorAll(".rm-leave-btn").forEach(b => on(b, "click", rmConfirmLeave));

function rmOnMessage(data){
  switch (data.type){
    case "pong": {
      const rtt = performance.now() - RM._pingP0;
      if (rtt < RM.minRtt){ RM.minRtt = rtt; RM.clockOffset = data.serverNow - (RM._pingT0 + rtt/2); }
      return;
    }
    case "state": return rmOnState(data);
    case "question": return rmOnQuestion(data);
    case "answered": return rmOnAnswered(data);
    case "lock": return rmOnLock(data);
    case "judging": return rmOnJudging(data);
    case "reveal": return rmOnReveal(data);
    case "mixShift": return toast(data.direction==="up" ? t("mixShiftUp") : t("mixShiftDown"));
    case "final": return rmOnFinal(data);
    case "notice": return (data.notices||[]).forEach(n => toast(noticeText(n)));
    // toast(), not rmEntryMsg(): this message arrives any time a server-side action fails
    // (e.g. "start" hitting sources-unreachable/too-few-questions), and the host is almost never
    // on screen-room-home (rmEntryMsg's element) when that happens - they're in the lobby, mid-
    // round, wherever. A toast is visible from every screen, so the failure is never silent.
    case "error": return toast(data.message || data.code || "Error");
  }
}
/* ---------------- lobby ---------------- */
function rmOnState(data){
  const wasHostBefore = RM.state ? rmIsHost() : null;
  RM.state = data;
  rmSaveActiveCode(); // first `state` after a successful connect - safe to remember for auto-rejoin on reload

  if (data.status==="lobby"){
    rmRenderLobby();
    if (rmActiveScreenId()!=="screen-lobby") show("screen-lobby", { silent:true });
  } else if (data.status==="finished"){
    // `final` (sent once, right when the round ends) carries the actual podium data; a bare
    // `state` snapshot alone (e.g. a reconnect that landed after the round already ended) has
    // nothing richer to show, so just make sure we're not stuck on a stale mid-round screen.
    if (rmActiveScreenId()!=="screen-room-podium") show("screen-room-podium");
  } else if (data.status==="playing"){
    document.body.classList.toggle("spectating", data.you?.role==="spectator" || data.you?.isJudge);
    // Reconnecting straight into a live question/judging phase is handled by handleSocket also
    // resending the dedicated `question`/`judging` message (see rmOnQuestion/rmOnJudging) - this
    // branch only covers the plain `state`-only phases (locked, or a reveal we reconnected into,
    // for which there is no cached payload to rebuild - the next question's `question` message
    // will resync it).
  }
  if (wasHostBefore===false && rmIsHost()) toast(t("hostLeftPromoted"));
}
const RM_CODE_KEY = "answerit_room_code";
function rmSaveActiveCode(){ try { localStorage.setItem(RM_CODE_KEY, RM.code); } catch {} }
function rmClearActiveCode(){ try { localStorage.removeItem(RM_CODE_KEY); } catch {} }
function rmActiveScreenId(){ return document.querySelector(".screen.active")?.id; }

function rmRenderLobby(){
  const s = RM.state; if (!s) return;
  $("lobbyCode").textContent = s.code || RM.code;
  $("lobbyPlayers").innerHTML = Object.values(s.players).map(p => `
    <div class="prow ${p.connected?"":"offline"} ${p.id===RM.me.id?"me":""}">
      ${s.teams[p.teamId] ? `<span class="teamdot" style="background:${s.teams[p.teamId].color}"></span>` : ""}
      <span class="pname">${esc(p.nickname)}</span>
      ${p.id===s.hostId ? `<span class="badge host">${esc(t("roleHost"))}</span>` : ""}
      ${p.role==="spectator" ? `<span class="badge">${esc(t("roleSpectator"))}</span>` : ""}
      ${!p.connected ? `<span class="badge">${esc(t("roleOffline"))}</span>` : ""}
      ${rmIsHost() && p.id!==RM.me.id ? `<button class="iconbtn" style="width:30px;height:30px" data-kick="${esc(p.id)}" title="${esc(t("kickBtn"))}">${icon("x")}</button>` : ""}
    </div>`).join("");
  $("lobbyPlayers").querySelectorAll("[data-kick]").forEach(b => on(b,"click",() => rmSend({type:"kick", playerId:b.dataset.kick})));

  const teamIds = Object.keys(s.teams);
  $("lobbyTeamsCard").classList.toggle("hide", !teamIds.length || rmMyRole()!=="player");
  $("lobbyTeamGrid").innerHTML = teamIds.map(id => `
    <button type="button" class="teamchip ${s.you?.teamId===id?"on":""}" data-team="${id}">
      <span class="teamdot" style="background:${s.teams[id].color}"></span>${esc(s.teams[id].name)}
    </button>`).join("");
  $("lobbyTeamGrid").querySelectorAll("[data-team]").forEach(b => on(b,"click",() => rmSend({type:"team", teamId:b.dataset.team})));

  const isHost = rmIsHost();
  $("lobbySettingsHost").classList.toggle("hide", !isHost);
  $("lobbySettingsGuest").classList.toggle("hide", isHost);
  $("lobbyStartBtn").classList.toggle("hide", !isHost);
  if (isHost) rmRenderLobbySettings(s.settings, s.mix);

  const msg = $("lobbyMsg");
  const noCats = isHost && (!s.settings.categories || !s.settings.categories.length);
  msg.textContent = noCats ? t("pickCategoryWarning") : "";
  msg.classList.toggle("hide", !noCats);
  $("lobbyStartBtn").disabled = noCats;
  $("lobbyStartBtn").innerHTML = `${icon("play")} <span>${esc(t("startRace"))}</span>`;
}

let rmCatGridBuilt = false;
function rmRenderLobbySettings(settings, mix){
  if (!rmCatGridBuilt){
    $("lobbyCatGrid").innerHTML = CATEGORIES.map(c => `
      <button type="button" class="cattile" data-c="${c.key}">${icon(c.icon)}<span>${esc(catLabel(c.key))}</span></button>`).join("");
    $("lobbyCatGrid").querySelectorAll("[data-c]").forEach(b => on(b,"click",() => {
      const cur = new Set((RM.state.settings.categories||[]).filter(c=>c!=="mix"));
      if (cur.has(b.dataset.c)) cur.delete(b.dataset.c); else cur.add(b.dataset.c);
      rmSend({ type:"configure", categories: cur.size ? [...cur] : [] });
    }));
    rmCatGridBuilt = true;
  }
  const active = new Set(settings.categories.includes("mix") ? CATEGORY_KEYS : settings.categories);
  $("lobbyCatGrid").querySelectorAll("[data-c]").forEach(b => b.classList.toggle("on", active.has(b.dataset.c)));

  const segs = [["lobbySegN","n"],["lobbySegStyle","style"],["lobbySegIntensity","intensity"],["lobbySegRegion","region"],["lobbySegTeams","teams"],["lobbySegPace","revealPace"],["lobbySegQLang","questionLang"]];
  for (const [id,field] of segs){
    const val = field==="questionLang" ? (settings[field] || "en") : settings[field];
    $(id).querySelectorAll("button").forEach(b => b.classList.toggle("on", String(b.dataset.v)===String(val)));
  }
  $("lobbyToggleStreaks").checked = settings.streaks;
  $("lobbyToggleJudgeOnly").checked = !!RM.state.judgeOnlyHost;
  $("lobbyMixBar").innerHTML = LEVELS.map(L => `<div style="width:${(mix[L]||0)/settings.n*100}%;background:var(${LEVEL_COLOR_VAR[L]})"></div>`).join("");
}
function rmWireLobbySeg(id, field, parse){
  $(id).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    rmSend({ type:"configure", [field]: parse ? parse(b.dataset.v) : b.dataset.v });
  });
}
rmWireLobbySeg("lobbySegN","n",Number);
rmWireLobbySeg("lobbySegStyle","style");
rmWireLobbySeg("lobbySegIntensity","intensity");
rmWireLobbySeg("lobbySegRegion","region");
rmWireLobbySeg("lobbySegTeams","teams",Number);
rmWireLobbySeg("lobbySegPace","revealPace");
rmWireLobbySeg("lobbySegQLang","questionLang");
on($("lobbyToggleStreaks"), "change", () => rmSend({type:"configure", streaks:$("lobbyToggleStreaks").checked}));
on($("lobbyToggleJudgeOnly"), "change", () => rmSend({type:"configure", judgeOnlyHost:$("lobbyToggleJudgeOnly").checked}));
on($("lobbyStartBtn"), "click", () => rmSend({type:"start"}));
on($("lobbyLeave"), "click", rmLeaveRoom);
on($("lobbyCode"), "click", () => {
  const code = $("lobbyCode").textContent;
  if (navigator.clipboard) navigator.clipboard.writeText(code).then(()=>toast(t("tapToCopy")+" ✓")).catch(()=>{});
});

/* ---------------- question ---------------- */
function rmOnQuestion(data){
  RM.question = data;
  if (data.qIndex===0) RM._lbRanks = null; // fresh round (incl. rematch) - no "previous rank" to arrow against yet
  clearInterval(RM.timerHandle);
  const localStartAt = data.startAt - RM.clockOffset;
  const delay = Math.max(0, localStartAt - Date.now());
  if (data.level==="hell"){
    const mod = data.modifiers?.[0];
    $("hellSub").textContent = mod==="rush" ? t("hellRush", Math.round((data.endsAt-data.startAt)/1000))
      : mod==="blind" ? t("hellBlind") : t("hellBasePoints");
    $("hellCard").classList.remove("hide");
    setTimeout(() => { $("hellCard").classList.add("hide"); rmShowQuestionNow(data); }, delay);
  } else if (data.isDouble){
    $("dblSub").textContent = t("doubleSub", (rmMyScore()||0).toLocaleString());
    $("dblCard").classList.remove("hide");
    setTimeout(() => { $("dblCard").classList.add("hide"); rmShowQuestionNow(data); }, delay);
  } else {
    setTimeout(() => rmShowQuestionNow(data), delay);
  }
}
function rmMyScore(){ return RM.state?.players?.find(p=>p.id===RM.me.id)?.score; }

function rmShowQuestionNow(q){
  show("screen-room-question");
  const isSpectator = rmMyRole()==="spectator";
  const isJudge = rmMyRole()==="judge";
  document.body.classList.toggle("spectating", isSpectator || isJudge);
  const chip = $("rqLevelChip");
  chip.textContent = levelName(q.level) + (q.isDouble ? " ×2" : "");
  chip.style.background = `var(${LEVEL_COLOR_VAR[q.level]})`;
  $("rqCatChip").innerHTML = `${icon(CAT_BY_KEY[q.category].icon)} ${catLabel(q.category)}`;
  $("rqProgress").textContent = q.isDouble ? t("theDouble") : t("questionOf", q.qIndex+1, q.total);
  $("rqText").textContent = q.text;
  $("rqAnswered").textContent = "";
  $("rqSpectatorNote").classList.toggle("hide", !(isSpectator || isJudge));
  $("rqLockedNote").classList.add("hide");

  const me = RM.state.players.find(p=>p.id===RM.me.id);
  const pill = $("rqStreakPill");
  if (RM.state.settings.streaks && me?.streak>0){
    pill.classList.remove("hide"); $("rqStreakVal").textContent = me.streak;
    $("rqStreakMult").textContent = "×"+streakMultiplier(me.streak).toFixed(1);
  } else pill.classList.add("hide");

  const optGrid = $("rqOptions"), openRow = $("rqOpenRow");
  if (isSpectator || isJudge){
    optGrid.classList.add("hide"); openRow.classList.add("hide");
  } else if (q.qType==="choice"){
    optGrid.classList.remove("hide"); openRow.classList.add("hide");
    const shapes=["tri","dia","cir","sq"], colors=["--shape-a","--shape-b","--shape-c","--shape-d"];
    optGrid.innerHTML = q.options.map((opt,i) => `
      <button type="button" class="opt" data-i="${i}" style="--opt-color:var(${colors[i%4]})">
        <span class="opt-shape ${shapes[i%4]}"></span><span class="opt-key">${i+1}</span>
        <span class="opt-text">${esc(opt)}</span></button>`).join("");
    optGrid.querySelectorAll(".opt").forEach(b => on(b,"click",() => rmSubmit(Number(b.dataset.i))));
  } else {
    optGrid.classList.add("hide"); openRow.classList.remove("hide");
    const input = $("rqOpenInput"); input.value=""; input.disabled=false; $("rqOpenSubmit").disabled=false; input.focus();
  }

  const seconds = Math.round((q.endsAt-q.startAt)/1000);
  rmStartTimer(q.endsAt, seconds, q.level);
}
function rmStartTimer(endsAtServer, seconds, level){
  const fill = $("rqTimerFill");
  fill.style.transition="none"; fill.style.transform="scaleX(1)"; fill.style.background=`var(${LEVEL_COLOR_VAR[level]})`;
  void fill.offsetWidth;
  if (!reduceMotion) requestAnimationFrame(() => { fill.style.transition = `transform ${seconds}s linear`; fill.style.transform="scaleX(0)"; });
  const localEndsAt = endsAtServer - RM.clockOffset;
  clearInterval(RM.timerHandle);
  RM.timerHandle = setInterval(() => {
    const left = Math.max(0, localEndsAt - Date.now());
    const s = Math.ceil(left/1000);
    $("rqTimerLabel").textContent = s;
    if (reduceMotion) fill.style.transform = `scaleX(${left/(seconds*1000)})`;
    if (left<=0) clearInterval(RM.timerHandle);
  }, 100);
}
function rmLockInputsUi(){
  $("rqOptions").querySelectorAll(".opt").forEach(b=>b.disabled=true);
  $("rqOpenInput").disabled = true; $("rqOpenSubmit").disabled = true;
  $("rqLockedNote").classList.remove("hide");
}
function rmSubmit(value){
  if (!RM.question) return;
  rmSend({ type:"answer", qIndex: RM.question.qIndex, value });
  rmLockInputsUi();
}
on($("rqOpenSubmit"), "click", () => { const v=$("rqOpenInput").value.trim(); if (v) rmSubmit(v); });
on($("rqOpenInput"), "keydown", e => { if (e.key==="Enter"){ const v=$("rqOpenInput").value.trim(); if (v) rmSubmit(v); } });

function rmOnAnswered(data){ $("rqAnswered").textContent = t("answeredOf", data.count, data.total); }
function rmOnLock(){ rmLockInputsUi(); $("rqLockedNote").innerHTML = `${icon("hourglass")} <span>${esc(t("lockedWaiting"))}</span>`; }

/* ---------------- judging (host only) ---------------- */
function rmOnJudging(data){
  RM._judging = data;
  $("judgeAnswer").textContent = data.correctAnswer;
  $("judgeAutoNote").textContent = t("judgeAutoApproved", data.auto.length);
  $("judgeDisputes").innerHTML = data.disputes.map(d => `
    <div class="judgerow" data-player="${esc(d.playerId)}">
      <div><div class="jname">${esc(d.nickname)}</div><div class="jtext">"${esc(d.text)}"</div></div>
      <div class="judge-actions">
        <button type="button" class="yes" data-v="1" title="correct">${icon("check")}</button>
        <button type="button" class="no" data-v="0" title="wrong">${icon("x")}</button>
      </div>
    </div>`).join("") || `<p style="color:var(--muted);font-size:13px">${esc(t("nobodyGotIt"))}</p>`;
  const verdicts = {};
  $("judgeDisputes").querySelectorAll(".judgerow").forEach(row => {
    const pid = row.dataset.player;
    row.querySelectorAll("button").forEach(btn => on(btn, "click", () => {
      verdicts[pid] = btn.dataset.v==="1";
      row.querySelectorAll("button").forEach(b=>b.classList.remove("picked"));
      btn.classList.add("picked");
    }));
  });
  RM._judgeVerdicts = verdicts;
  // Even a non-judge-host client can receive this if it targeted the wrong socket somehow;
  // guard so only the actual judge sees the panel navigate them there.
  if (RM.state?.you?.isJudge) show("screen-room-judge");
}
on($("judgeDoneBtn"), "click", () => {
  rmSend({ type:"judge", qIndex: RM._judging?.qIndex, verdicts: RM._judgeVerdicts||{} });
});

/* ---------------- reveal ---------------- */
function rmOnReveal(data){
  clearInterval(RM.timerHandle);
  const q = RM.question;
  show("screen-room-reveal");
  const chip = $("rrLevelChip");
  chip.textContent = q ? levelName(q.level) + (q.isDouble?" ×2":"") : "";
  if (q) chip.style.background = `var(${LEVEL_COLOR_VAR[q.level]})`;
  if (q) $("rrCatChip").innerHTML = `${icon(CAT_BY_KEY[q.category].icon)} ${catLabel(q.category)}`;
  $("rrQuestionText").textContent = q?.text || "";
  $("rrAnswer").textContent = data.correctAnswer;
  $("rrDisputeNote").classList.toggle("hide", !data.disputeAutoResolved);
  $("rrNobodyNote").classList.toggle("hide", !data.nobodyGotIt);

  const distEl = $("rrDistribution");
  if (q && q.qType==="choice"){
    const total = data.distribution.reduce((a,b)=>a+b,0) || 1;
    const colors=["--shape-a","--shape-b","--shape-c","--shape-d"];
    distEl.innerHTML = q.options.map((opt,i) => `
      <div class="dist-row"><span class="dist-label">${esc(opt)}</span>
        <div class="dist-bar"><div style="width:${data.distribution[i]/total*100}%;background:var(${colors[i%4]})"></div></div>
        <span class="dist-n">${data.distribution[i]}</span></div>`).join("");
  } else if (Array.isArray(data.distribution)){
    distEl.innerHTML = `<div class="openword">${data.distribution.map(a => `<span class="${a.correct?"correct":""}">${esc(a.text||t("noAnswer"))}</span>`).join("") || ""}</div>`;
  } else distEl.innerHTML = "";

  const mine = data.results.find(r=>r.playerId===RM.me.id);
  const wrap = $("rrMyResultWrap");
  wrap.classList.toggle("hide", !mine);
  if (mine){
    $("rrMark").innerHTML = icon(mine.correct?"check":"x");
    $("rrMark").className = "mark " + (mine.correct?"ok":"no");
    $("rrPoints").textContent = (mine.correct?"+":"") + mine.points.toLocaleString();
    $("rrTime").textContent = mine.ms!=null ? fmtMs(mine.ms) : "-";
    $("rrStreak").textContent = mine.streak;
    const mult = mine.correct ? streakMultiplier(mine.streak) : 1;
    $("rrMultWrap").classList.toggle("hide", !mine.correct || mult<=1);
    $("rrMult").textContent = mult.toFixed(1);
  }

  rmRenderLeaderboardWithRanks($("rrLeaderboard"), data.results.map(r=>({ playerId:r.playerId, total:r.total })));

  const isHost = rmIsHost();
  $("rrNextBtn").classList.toggle("hide", !isHost);
  $("rrNextBtn").disabled = false; // fresh reveal - re-enable in case the previous one was clicked
  $("rrWaitingNote").classList.toggle("hide", isHost);
}

// Shared by the reveal screen and the podium: sorts by score, and - only when a PREVIOUS
// ranking is on record for this same room (so the very first leaderboard of a round shows no
// arrows) - marks each row with an up/blue or down/red arrow versus its last-seen rank, bumps
// the row, and plays a short cue for the *viewer's own* rank change (one sound per reveal, not
// one per row - a whole leaderboard re-sorting at once would otherwise be a chord of beeps).
function rmRenderLeaderboardWithRanks(el, rows){
  const prevRanks = RM._lbRanks;
  const sorted = rows.slice().sort((a,b)=>b.total-a.total);
  const newRanks = {};
  let myDelta = 0;
  el.innerHTML = sorted.map((r,i) => {
    const rank = i+1;
    newRanks[r.playerId] = rank;
    const prev = prevRanks?.[r.playerId];
    let arrow = "", bump = "";
    if (prev != null && prev !== rank){
      const up = rank < prev;
      arrow = `<span class="rank-arrow ${up?"up":"down"}">${icon(up?"arrowUp":"arrowDown")}</span>`;
      bump = " rank-bump";
      if (r.playerId===RM.me.id) myDelta = up ? 1 : -1;
    }
    const p = RM.state.players.find(pp=>pp.id===r.playerId);
    return `<div class="lbrow${bump}"><span class="rank">${rank}</span>${arrow}<span class="lbname">${esc(p?.nickname||"?")}</span><span class="lbscore">${r.total.toLocaleString()}</span></div>`;
  }).join("");
  if (prevRanks && myDelta) rmRankSound(myDelta > 0 ? "up" : "down");
  RM._lbRanks = newRanks;
}

// Two short sine-wave beeps via the Web Audio API - no audio asset to fetch, same
// zero-dependency reasoning as the inline SVG icons and canvas confetti elsewhere on this page.
let _rmAudioCtx = null;
function rmBeep(freq, ms){
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    _rmAudioCtx = _rmAudioCtx || new Ctx();
    const ctx = _rmAudioCtx;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = "sine"; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.16, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + ms/1000);
    osc.connect(gain).connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + ms/1000);
  } catch {}
}
function rmRankSound(direction){
  if (direction==="up") { rmBeep(660, 90); setTimeout(()=>rmBeep(990, 140), 90); }
  else { rmBeep(440, 90); setTimeout(()=>rmBeep(260, 160), 90); }
}
// Disabled immediately on click, not just re-enabled on the next reveal: a double-click otherwise
// fires two "next" sends before either round-trips, and while the server now no-ops the second one
// (room.js's serveNextQuestion in-flight guard), this stops the extra message going out at all.
on($("rrNextBtn"), "click", () => { $("rrNextBtn").disabled = true; rmSend({type:"next"}); });

/* ---------------- podium ---------------- */
function rmOnFinal(data){
  document.body.classList.remove("spectating");
  show("screen-room-podium");
  $("rpTeamsCard").classList.toggle("hide", !data.teams);
  if (data.teams){
    $("rpTeams").innerHTML = data.teams.map((tm,i) => `
      <div class="lbrow"><span class="rank">${i+1}</span><span class="teamdot" style="background:${tm.color}"></span>
        <span class="lbname">${esc(tm.name)}</span><span class="lbscore">${tm.score.toLocaleString()}</span></div>`).join("");
  }
  $("rpStandings").innerHTML = data.podium.map(p => `
    <div class="lbrow"><span class="rank">${p.rank}</span><span class="lbname">${esc(p.nickname)}${p.wins?` <span class="badge">${p.wins}🏆</span>`:""}</span><span class="lbscore">${p.score.toLocaleString()}</span></div>`).join("");

  const mine = data.podium.find(p=>p.id===RM.me.id);
  const cats = mine?.byCategory || {};
  $("rpCatBreakdown").innerHTML = Object.entries(cats).map(([key,s]) => `
    <div class="catrow"><div class="name">${icon(CAT_BY_KEY[key].icon)} ${catLabel(key)}</div>
      <div class="bar"><div style="width:${s.n?Math.round(s.c/s.n*100):0}%"></div></div>
      <div class="frac">${s.c}/${s.n}</div></div>`).join("") || `<p style="color:var(--muted);font-size:13px">${esc(t("noQuestionsAnswered"))}</p>`;

  const isHost = rmIsHost();
  $("rpHostControls").classList.toggle("hide", !isHost);
  $("rpGuestNote").classList.toggle("hide", isHost);
  if (data.ranOut) toast(noticeText({key:data.ranOut}));

  rmRevealPodium3(data.podium.filter(p=>p.rank<=3));
}

// §9/§18 - the podium reveals bottom-to-top with confetti on first. Stands are all rendered
// up front (so layout/order never jumps) but start invisible via CSS; this just adds `.show` to
// one at a time, 3rd -> 2nd -> 1st, each with its own little sting - full drama for 1st.
const PODIUM_MEDALS = { 1:"🥇", 2:"🥈", 3:"🥉" };
function rmRevealPodium3(top3){
  const el = $("rpPodium3");
  el.classList.toggle("hide", !top3.length);
  if (!top3.length) { el.innerHTML = ""; return; }
  el.innerHTML = top3.map(p => `
    <div class="pd-stand" data-rank="${p.rank}">
      <div class="pd-name">${esc(p.nickname)}</div>
      <div class="pd-score">${p.score.toLocaleString()}</div>
      <div class="pd-block">${PODIUM_MEDALS[p.rank] || p.rank}</div>
    </div>`).join("");

  const order = [3,2,1].filter(r => top3.some(p=>p.rank===r));
  const revealOne = (rank) => {
    const stand = el.querySelector(`[data-rank="${rank}"]`);
    stand?.classList.add("show");
    if (rank===1){ confetti.burst(); rmBeep(660,100); setTimeout(()=>rmBeep(990,220),110); }
    else rmBeep(rank===2 ? 520 : 420, 130);
  };
  if (reduceMotion){ order.forEach(revealOne); return; }
  order.forEach((rank, i) => setTimeout(() => revealOne(rank), 350 + i*750));
}
on($("rpRematch"), "click", () => rmSend({type:"rematch"}));
on($("rpSettings"), "click", () => { rmRenderLobby(); show("screen-lobby"); });
on($("rpLeave"), "click", rmLeaveRoom);

// §19 keyboard parity with solo's own handler (line ~3092): 1-4 pick an option, Enter/Space
// submits the open-answer field or advances the reveal (host only - a guest's Enter shouldn't
// silently no-op-send anything, and rmSend already drops a `next` from a non-host server-side,
// but keeping the keybinding host-only avoids the disabled button flashing for everyone else).
document.addEventListener("keydown", (e) => {
  if ($("screen-room-question").classList.contains("active") && rmMyRole()==="player"){
    if (["1","2","3","4"].includes(e.key) && !$("rqOptions").classList.contains("hide")){
      const btn = $("rqOptions").querySelector(`[data-i="${Number(e.key)-1}"]`);
      if (btn && !btn.disabled) rmSubmit(Number(e.key)-1);
    }
  }
  if ($("screen-room-reveal").classList.contains("active") && rmIsHost() && (e.key==="Enter"||e.key===" ")){
    e.preventDefault();
    if (!$("rrNextBtn").disabled) $("rrNextBtn").click(); // routes through the same disabled-on-click guard as a mouse click, so a held/repeating key can't flood "next" sends
  }
});

/* ============================================================
   Boot
   ============================================================ */
mountIcons();
applyLanguage(lang); // also runs renderCatGrid() + refreshSetup(), which boot needs anyway
show("screen-menu");

// Rejoin a room that was still open when the page was last closed/refreshed (§17 reconnects) -
// the player id is permanent (RM_ID_KEY) so the Durable Object recognises us and hands back our
// existing score/streak/position. Silent: if the room is long gone, rmConnect's own "couldn't
// join" path quietly lands back on the entry screen instead of the menu, which is an acceptable
// surprise given the alternative (guessing wrong and stranding a mid-round player on reload).
(() => {
  let savedCode = null;
  try { savedCode = localStorage.getItem(RM_CODE_KEY); } catch {}
  if (savedCode && /^\d{6}$/.test(savedCode) && RM.me.nickname) rmConnect(savedCode, { spectator:false });
})();

// PWA install support. serviceWorker is undefined on file:// (no origin to scope to) - the
// site already plays fine there, this just skips silently instead of throwing.
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
