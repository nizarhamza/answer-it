/* ============================================================
   Round flow
   ============================================================ */
let R = null; // active round runtime state

function newRoundState(){
  return {
    session:null, pool:null, current:null, qIndexShown:0, isDoubleNow:false,
    score:0, streak:0, bestStreak:0, correctCount:0, answeredCount:0,
    avgMsSum:0, byCategory:{}, log:[], startAt:0, questionStartAt:0, locked:false,
    timerHandle:null, servedLevelsForAwards:[],
  };
}

function progressText(p){ return p.key==="toppingUp" ? t("toppingUp", p.i, p.total) : t(p.key); }
function noticeText(n){ return n.key==="toppedUpFrom" ? t("toppedUpFrom", levelName(n.level), levelName(n.nearest)) : t(n.key); }

let loadingCancelFlag = false;
on($("loadingCancel"), "click", () => { loadingCancelFlag = true; show("screen-setup"); });

on($("startRoundBtn"), "click", async () => {
  show("screen-loading");
  loadingCancelFlag = false;
  $("loadingSub").textContent = t("fetchingQuestions");
  $("loadingCancel").classList.remove("hide");
  try {
    const pool = await buildPool(settings.categories, settings.n, p => $("loadingSub").textContent = progressText(p), () => loadingCancelFlag);
    const total = LEVELS.filter(L=>L!=="hell").reduce((s,L)=>s+poolTotal(pool, settings.categories, L), 0);
    if (total < Math.min(6, settings.n)){
      $("errorMsg").textContent = t("errorTooLittle");
      show("screen-error"); return;
    }
    R = newRoundState();
    R.pool = pool;
    R.session = makeRoundSession(pool, settings);
    R.startAt = Date.now();
    advanceRound();
  } catch (err){
    if (err instanceof RoundCancelled) return; // loadingCancel already navigated back to setup
    $("errorMsg").textContent = t("errorUnreachable");
    show("screen-error");
  }
});
on($("errorRetry"), "click", () => $("startRoundBtn").click());
on($("errorMenu"), "click", () => show("screen-menu"));

async function advanceRound(){
  if (!R.isDoubleNow && R.qIndexShown >= settings.n){
    R.isDoubleNow = true;
    let dq = R.session.buildDouble();
    if (!dq){ toast(t("ranOutDouble")); finishRound(); return; }
    dq = await translateQuestion(dq);
    showInterstitial("dbl", dq);
    return;
  }
  if (R.isDoubleNow){ finishRound(); return; }

  let q = R.session.nextQuestion();
  if (!q){
    // Pool truly exhausted despite the upfront adequacy check (§20: never invent questions -
    // ending a few short is the honest fallback, but the player is told, not left guessing).
    toast(t("ranOutFresh", R.qIndexShown));
    finishRound();
    return;
  }
  R.session.notices.forEach(n => toast(noticeText(n)));
  R.session.notices.length = 0;
  R.qIndexShown++;
  q = await translateQuestion(q);
  if (q.level==="hell"){ showInterstitial("hell", q); return; }
  showQuestion(q);
}

function showInterstitial(kind, q){
  if (kind==="hell"){
    const mod = q.modifiers?.[0];
    $("hellSub").textContent = mod==="rush" ? t("hellRush", q.timeLimit)
      : mod==="blind" ? t("hellBlind")
      : t("hellBasePoints");
    $("hellCard").classList.remove("hide");
    setTimeout(() => { $("hellCard").classList.add("hide"); showQuestion(q); }, reduceMotion ? 400 : 1600);
  } else {
    $("dblSub").textContent = t("doubleSub", R.score.toLocaleString());
    $("dblCard").classList.remove("hide");
    setTimeout(() => { $("dblCard").classList.add("hide"); showQuestion(q); }, reduceMotion ? 400 : 1800);
  }
}

function showQuestion(q){
  R.current = q; R.locked = false;
  show("screen-question");
  const chip = $("qLevelChip");
  chip.textContent = levelName(q.level) + (q.isDouble ? " ×2" : "");
  chip.style.background = `var(${LEVEL_COLOR_VAR[q.level]})`;
  $("qCatChip").innerHTML = `${icon(CAT_BY_KEY[q.category].icon)} ${catLabel(q.category)}`;
  $("qProgress").textContent = q.isDouble ? t("theDouble") : t("questionOf", R.qIndexShown, settings.n);
  $("qText").textContent = q.text;

  const pill = $("streakPill");
  if (settings.streaks && R.streak>0){
    pill.classList.remove("hide");
    $("streakVal").textContent = R.streak;
    $("streakMult").textContent = "×" + streakMultiplier(R.streak).toFixed(1);
  } else pill.classList.add("hide");

  const optGrid = $("qOptions"), openRow = $("qOpenRow"), lockedNote = $("qLockedNote");
  lockedNote.classList.add("hide");
  if (q.type==="choice"){
    optGrid.classList.remove("hide"); openRow.classList.add("hide");
    const shapes = ["tri","dia","cir","sq"]; const colors = ["--shape-a","--shape-b","--shape-c","--shape-d"];
    optGrid.innerHTML = q.options.map((opt,i) => `
      <button type="button" class="opt" data-i="${i}" style="--opt-color:var(${colors[i%4]})">
        <span class="opt-shape ${shapes[i%4]}"></span>
        <span class="opt-key">${i+1}</span>
        <span class="opt-text">${esc(opt)}</span>
        <span class="opt-mark hide"></span>
      </button>`).join("");
    optGrid.querySelectorAll(".opt").forEach(b => on(b, "click", () => submitAnswer(Number(b.dataset.i))));
  } else {
    optGrid.classList.add("hide"); openRow.classList.remove("hide");
    const input = $("qOpenInput");
    input.value = ""; input.disabled = false; $("qOpenSubmit").disabled = false; input.focus();
  }

  R.questionStartAt = performance.now();
  startTimer(q.timeLimit, q.level);
}

function startTimer(seconds, level){
  const fill = $("timerFill");
  fill.style.transition = "none"; fill.style.transform = "scaleX(1)";
  fill.style.background = `var(${LEVEL_COLOR_VAR[level]})`;
  void fill.offsetWidth;
  if (!reduceMotion){
    requestAnimationFrame(() => { fill.style.transition = `transform ${seconds}s linear`; fill.style.transform = "scaleX(0)"; });
  }
  const endAt = performance.now() + seconds*1000;
  $("timerLabel").textContent = seconds;
  let announced10=false, announced5=false;
  clearInterval(R.timerHandle);
  R.timerHandle = setInterval(() => {
    if (R.locked){ clearInterval(R.timerHandle); return; }
    const left = Math.max(0, endAt - performance.now());
    const s = Math.ceil(left/1000);
    $("timerLabel").textContent = s;
    if (reduceMotion) fill.style.transform = `scaleX(${left/(seconds*1000)})`;
    if (s<=10 && !announced10){ announced10=true; $("timerAnnounce").textContent = t("secondsLeft", 10); }
    if (s<=5 && !announced5){ announced5=true; $("timerAnnounce").textContent = t("secondsLeft", 5); }
    if (left<=0){ clearInterval(R.timerHandle); $("timerAnnounce").textContent = t("timesUp"); onTimeout(); }
  }, 100);
}

function lockInputs(){
  $("qOptions").querySelectorAll(".opt").forEach(b => b.disabled = true);
  $("qOpenInput").disabled = true;
  $("qOpenSubmit").disabled = true;
}
function onTimeout(){
  if (R.locked) return;
  R.locked = true;
  lockInputs();
  finishAnswer({ verdict:"wrong", ms: R.current.timeLimit*1000, submittedText:"" });
}
on($("qOpenSubmit"), "click", () => submitOpen());
on($("qOpenInput"), "keydown", e => { if (e.key==="Enter") submitOpen(); });
function submitOpen(){
  const val = $("qOpenInput").value.trim();
  if (!val){ return; }
  submitAnswer(val);
}
function submitAnswer(value){
  if (R.locked) return;
  R.locked = true;
  clearInterval(R.timerHandle);
  lockInputs();
  const q = R.current;
  const ms = clamp(performance.now() - R.questionStartAt, 0, q.timeLimit*1000);
  let verdict, submittedText;
  if (q.type==="choice"){
    verdict = value===q.answerIndex ? "correct" : "wrong";
    submittedText = q.options[value];
    const optEls = $("qOptions").querySelectorAll(".opt");
    optEls.forEach((el,i) => {
      if (i===q.answerIndex) el.classList.add("correct");
      else if (i===value) el.classList.add("wrong");
      else el.classList.add("dim");
    });
  } else {
    verdict = matchOpenAnswer(value, q.correctAnswer, q.accepted);
    submittedText = value;
    $("qOpenInput").blur();
  }
  finishAnswer({ verdict, ms, submittedText });
}

function finishAnswer({ verdict, ms, submittedText }){
  const q = R.current;
  const disputeAutoResolved = verdict==="dispute"; // solo has no host - auto-resolve generous (§11, §20)
  const correct = verdict!=="wrong";

  const result = scoreAnswer({
    level:q.level, type:q.type, isDouble:!!q.isDouble, responseTimeMs: ms,
    streakBefore: settings.streaks ? R.streak : 0, correct,
    hellInsurance: settings.hellInsurance,
  });
  R.score += result.points;
  R.streak = settings.streaks ? result.streakAfter : 0;
  R.bestStreak = Math.max(R.bestStreak, R.streak);
  R.answeredCount++;
  R.avgMsSum += ms;
  if (correct) R.correctCount++;
  R.session.recordOutcome(correct);
  R.servedLevelsForAwards.push(q.level);

  const bc = (R.byCategory[q.category] ||= { c:0, n:0 });
  bc.n++; if (correct) bc.c++;

  R.log.push({ text:q.text, category:q.category, level:q.level, isDouble:!!q.isDouble, submittedText, correctAnswer:q.displayAnswer||q.correctAnswer, correct, points:result.points, ms });

  renderReveal(q, { verdict, correct, ms, result, disputeAutoResolved });
}

function renderReveal(q, { verdict, correct, ms, result, disputeAutoResolved }){
  const chip = $("rLevelChip");
  chip.textContent = levelName(q.level) + (q.isDouble ? " ×2" : "");
  chip.style.background = `var(${LEVEL_COLOR_VAR[q.level]})`;
  $("rCatChip").innerHTML = `${icon(CAT_BY_KEY[q.category].icon)} ${catLabel(q.category)}`;
  $("rAnswer").textContent = q.displayAnswer || q.correctAnswer;
  $("rDisputeNote").classList.toggle("hide", !disputeAutoResolved);

  $("rMark").innerHTML = icon(correct ? "check" : "x");
  $("rMark").className = "mark " + (correct ? "ok" : "no");
  $("rPoints").textContent = (correct ? "+" : "") + result.points.toLocaleString();
  $("rTime").textContent = fmtMs(ms);
  $("rStreak").textContent = R.streak;
  $("rMultWrap").classList.toggle("hide", !correct || result.multiplier<=1);
  $("rMult").textContent = result.multiplier.toFixed(1);
  $("rScore").textContent = R.score.toLocaleString();

  const pill = $("streakPill");
  if (correct && settings.streaks && R.streak>0){ pill.classList.remove("hide"); pill.classList.add("bump"); setTimeout(()=>pill.classList.remove("bump"), 420); }

  show("screen-reveal");
}
function nextFromReveal(){
  if (R.isDoubleNow) { finishRound(); return; }
  advanceRound();
}
on($("revealNext"), "click", nextFromReveal);

/* ============================================================
   Podium
   ============================================================ */
function finishRound(){
  markSeen(R.session.servedIds);
  const pb = loadPB();
  let isNewOverall = R.score > (pb.overall||0);
  if (isNewOverall) pb.overall = R.score;
  let catPB = false;
  if (settings.categories.length===1){
    const key = settings.categories[0];
    const prev = pb.byCategory[key]||0;
    if (R.score > prev){ pb.byCategory[key] = R.score; catPB = true; }
  }
  savePB(pb);

  $("finalScore").textContent = R.score.toLocaleString();
  $("pbBadge").classList.toggle("hide", !(isNewOverall || catPB));
  $("pbBadge").innerHTML = icon("partyPopper") + " " + esc(catPB ? t("newPersonalBestInCategory", catLabel(settings.categories[0])) : t("newPersonalBest"));

  $("catBreakdown").innerHTML = Object.entries(R.byCategory).map(([key, s]) => `
    <div class="catrow">
      <div class="name">${icon(CAT_BY_KEY[key].icon)} ${catLabel(key)}</div>
      <div class="bar"><div style="width:${s.n?Math.round(s.c/s.n*100):0}%"></div></div>
      <div class="frac">${s.c}/${s.n}</div>
    </div>`).join("") || `<p style="color:var(--muted);font-size:13px">${esc(t("noQuestionsAnswered"))}</p>`;

  $("awardsList").innerHTML = computeAwards().map(a => `<div>${a}</div>`).join("") || `<p style="color:var(--muted);font-size:13px">${esc(t("playFullRoundForAwards"))}</p>`;

  $("reviewList").innerHTML = R.log.map(l => `
    <div class="reviewrow" title="${esc(l.text)}">
      <span class="rmark" style="color:${l.correct?'var(--lvl-easy)':'var(--lvl-hell)'}">${icon(l.correct?"circleCheck":"circleX")}</span>
      <span class="rtext">${esc(l.text)}${l.correct ? "" : esc(t("youAnswerFmt", l.submittedText || t("noAnswer"), l.correctAnswer))}</span>
      <span style="color:var(--muted);flex:none">${l.correct?"+":""}${l.points}</span>
    </div>`).join("");

  show("screen-podium");
  confetti.burst();
}

function computeAwards(){
  const awards = [];
  if (R.avgMsSum>0 && R.answeredCount>0) {
    const avg = R.avgMsSum/R.answeredCount;
    if (avg < 4000) awards.push(icon("timer") + " " + esc(t("fastestFinger", (avg/1000).toFixed(1))));
  }
  if (R.bestStreak>=5) awards.push(icon("snowflake") + " " + esc(t("iceCold", R.bestStreak)));
  if (R.log.some(l => l.level==="hell" && l.correct)) awards.push(icon("skull") + " " + esc(t("againstAllOdds")));
  for (const [key,s] of Object.entries(R.byCategory)) if (s.n>=3 && s.c===s.n) awards.push(icon("target") + " " + esc(t("specialist", catLabel(key))));
  return awards;
}

on($("podiumRematch"), "click", () => $("startRoundBtn").click());
on($("podiumSettings"), "click", () => { renderCatGrid(); refreshSetup(); show("screen-setup"); });
on($("podiumMenu"), "click", () => show("screen-menu"));

/* ============================================================
   Modals
   ============================================================ */
function openModal(html){
  $("modalBody").innerHTML = html;
  $("modalScrim").classList.remove("hide");
}
function closeModal(){ $("modalScrim").classList.add("hide"); }
on($("modalScrim"), "click", e => { if (e.target===$("modalScrim")) closeModal(); });

on($("menuHowTo"), "click", () => openModal(`
  <h2>${esc(t("howToPlayTitle"))}</h2>
  <p style="margin-bottom:10px">${esc(t("howToPlayIntro"))}</p>
  <table style="width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:14px">
    <tr style="color:var(--muted)"><th style="text-align:start">${esc(t("tableHeaderLevel"))}</th><th style="text-align:start">${esc(t("tableHeaderPoints"))}</th><th style="text-align:start">${esc(t("tableHeaderClock"))}</th></tr>
    <tr><td>${lvlDot("easy")} ${esc(levelName("easy"))}</td><td>600</td><td>15s</td></tr>
    <tr><td>${lvlDot("medium")} ${esc(levelName("medium"))}</td><td>1,000</td><td>20s</td></tr>
    <tr><td>${lvlDot("hard")} ${esc(levelName("hard"))}</td><td>1,500</td><td>25s</td></tr>
    <tr><td>${lvlDot("hell")} ${esc(levelName("hell"))}</td><td>2,500</td><td>35s</td></tr>
  </table>
  <p style="margin-bottom:8px"><b>${esc(t("speedMattersBold"))}</b> ${esc(t("speedMattersText"))}</p>
  <p style="margin-bottom:8px"><b>${esc(t("streaksBold"))}</b>${esc(t("streaksText"))}</p>
  <p style="margin-bottom:8px"><b>${esc(t("theDoubleBold"))}</b>${esc(t("theDoubleText"))}</p>
  <p>${esc(t("wrongAnswersText"))}</p>
  <div style="text-align:end;margin-top:14px"><button class="btn btn-primary" onclick="document.getElementById('modalScrim').classList.add('hide')">${esc(t("gotIt"))}</button></div>
`));
on($("menuCredits"), "click", () => openModal(`
  <h2>${esc(t("creditsTitle"))}</h2>
  <p style="margin-bottom:10px">${esc(t("creditsQuestionsFrom"))} <a href="https://the-trivia-api.com/" target="_blank" rel="noopener">The Trivia API</a> (CC BY-NC 4.0) ${esc(t("creditsAnd"))} <a href="https://opentdb.com/" target="_blank" rel="noopener">Open Trivia Database</a> (CC BY-SA 4.0).</p>
  <p style="color:var(--muted);font-size:13px">${esc(t("creditsStack"))}</p>
  <div style="text-align:end;margin-top:14px"><button class="btn btn-primary" onclick="document.getElementById('modalScrim').classList.add('hide')">${esc(t("close"))}</button></div>
`));

/* ============================================================
   Keyboard controls (§19)
   ============================================================ */
document.addEventListener("keydown", (e) => {
  if (!$("modalScrim").classList.contains("hide") && e.key==="Escape"){ closeModal(); return; }
  if ($("screen-question").classList.contains("active") && !R?.locked){
    if (["1","2","3","4"].includes(e.key) && $("qOptions").classList.contains("hide")===false){
      const i = Number(e.key)-1;
      const btn = $("qOptions").querySelector(`[data-i="${i}"]`);
      if (btn && !btn.disabled) submitAnswer(i);
    }
  }
  if ($("screen-reveal").classList.contains("active") && (e.key==="Enter" || e.key===" " || e.key==="Escape")){
    e.preventDefault(); nextFromReveal();
  }
});

/* ============================================================
   Boot
   ============================================================ */
mountIcons();
applyLanguage(lang); // also runs renderCatGrid() + refreshSetup(), which boot needs anyway
show("screen-menu");
</script>
